# Deploy from main (autoship L8-L9): derived from the merged diff, never from
# memory. Runs NO model and holds the only prod secret (T12: agent jobs and
# deploy jobs never mix).
#
#   migrate  - prisma migrate deploy to PROD when migrations changed.
#              Old code runs on the new schema while Vercel builds; guardrails
#              are structural check 13 (no NOT NULL without default) plus
#              migration review - NOT a full additive-only proof. If a
#              migration still breaks old code: rollback.sh api + incident.
#   smoke    - waits for Vercel's production deployment of this commit, then
#              runs the prod-safe API smoke; failure files an incident issue.
#              Rollback is one local command: scripts/deploy/rollback.sh api
#   ota      - attempts guarded iOS publication on every surviving main push,
#              since concurrency can replace a pending mobile push with an
#              API-only push; native drift still blocks publication.
name: Deploy
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact verified protected main source
        required: true
        type: string
      verify_run:
        description: Successful main push Verify run ID
        required: true
        type: string
      acceptance_sha256:
        description: Operator-validated issue acceptance digest
        required: true
        type: string

run-name: 'Release ${{ inputs.release_sha }} Verify ${{ inputs.verify_run }} Acceptance ${{ inputs.acceptance_sha256 }}'

# Serialize active deploys. GitHub can replace a pending run, so each surviving
# run reconciles mobile delivery regardless of its individual push range.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}

permissions:
  actions: read
  contents: read
  issues: write
  statuses: read
  deployments: read

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == inputs.release_sha
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.f.outputs.migrations }}
      mobile: ${{ steps.f.outputs.mobile }}
      api: ${{ steps.f.outputs.api }}
    steps:
      - name: Require independently installed App initiation and exact Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_RUN: ${{ inputs.verify_run }}
          ACCEPTANCE_SHA: ${{ inputs.acceptance_sha256 }}
          # Authenticated App/bot readback; final resolved bytes require independent review.
          DISPATCH_ACTOR_ID: '341457831'
          DISPATCH_ACTOR_LOGIN: 'fitsy-delivery-approval[bot]'
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$ACCEPTANCE_SHA" =~ ^[0-9a-f]{64}$ && "$VERIFY_RUN" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$DISPATCH_ACTOR_ID" =~ ^[1-9][0-9]*$ ]] || { echo "App identity not installed"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$RUNNER_TEMP/release-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFY_RUN}" > "$RUNNER_TEMP/verify-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/352020416/runs?head_sha=${RELEASE_SHA}&event=push&per_page=1" > "$RUNNER_TEMP/latest-verify.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'release-run.json').read_text())
          verify = json.loads((root / 'verify-run.json').read_text())
          latest = json.loads((root / 'latest-verify.json').read_text())
          actor = {'id': int(os.environ['DISPATCH_ACTOR_ID']), 'login': os.environ['DISPATCH_ACTOR_LOGIN'], 'type': 'Bot'}
          assert all(all(run[field][key] == value for key, value in actor.items()) for field in ('actor', 'triggering_actor'))
          assert run['workflow_id'] == 352171272 and run['event'] == 'workflow_dispatch' and run['head_branch'] == 'main'
          assert run['head_sha'] == os.environ['RELEASE_SHA'] and run['path'] == '.github/workflows/deploy.yml'
          assert verify['workflow_id'] == 352020416 and verify['path'] == '.github/workflows/verify.yml'
          assert verify['event'] == 'push' and verify['head_branch'] == 'main' and verify['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert verify['head_sha'] == os.environ['RELEASE_SHA'] and verify['status'] == 'completed' and verify['conclusion'] == 'success'
          assert latest['workflow_runs'] and latest['workflow_runs'][0]['id'] == int(os.environ['VERIFY_RUN'])
          PYCODE
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
      - id: f
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify completed for this frozen main source; reconcile every release surface.
          CURRENT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          [ "$CURRENT" = "$RELEASE_SHA" ] || { echo "superseded main source"; exit 1; }
          CHANGED=$(printf 'prisma/migrations/x\napps/mobile/x\napps/api/x\n')
          echo "$CHANGED"
          {
            echo "migrations=$(echo "$CHANGED" | grep -q '^prisma/migrations/' && echo true || echo false)"
            echo "mobile=$(echo "$CHANGED" | grep -qE '^(apps/mobile/|packages/shared/|scripts/deploy/(native-compatibility\.mjs|ios-binary-baseline\.json|ota\.sh)$)' && echo true || echo false)"
            echo "api=$(echo "$CHANGED" | grep -qE '^(apps/api/|packages/|prisma/|scripts/|vercel\.json|package\.json|package-lock\.json)' && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  migrate:
    environment: production-release
    # Runs on EVERY push: migrate deploy is a no-op when nothing is pending,
    # and gating it on this push's diff loses migrations from pushes that a
    # concurrency queue superseded (lens finding, 2026-09-07).
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Migrate production
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: bash scripts/deploy/migrate-prod.sh
      - name: File incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --label incident \
            --title "incident: prod migration failed at ${RELEASE_SHA:0:7}" \
            --body "prisma migrate deploy against prod failed for $RELEASE_SHA. Production promotion must remain withheld; if the new code needs the new schema, roll back: \`scripts/deploy/rollback.sh api\`. Closing PR must add fix + detector + constraint."

  smoke:
    environment: production-release
    needs: [changes, migrate]
    # Replaced pending pushes can contain API changes absent from this push's diff.
    if: always() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Wait for Vercel PRODUCTION deployment of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the Deployments API filtered to environment=Production: the same
          # sha also gets a Preview deployment via the dev-branch mirror, and a
          # bare commit status cannot tell them apart.
          for i in $(seq 1 60); do
            DID=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${RELEASE_SHA}&environment=Production" --jq '.[0].id' 2>/dev/null || true)
            if [ -n "$DID" ] && [ "$DID" != "null" ]; then
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/$DID/statuses" --jq '.[0].state' 2>/dev/null || true)
              echo "production deployment $DID: ${STATE:-pending} ($i)"
              [ "$STATE" = "success" ] && exit 0
              case "$STATE" in failure|error) echo "vercel production deploy failed"; exit 1 ;; esac
            else
              echo "no Production deployment yet ($i)"
            fi
            sleep 20
          done
          echo "timed out waiting for the Vercel production deployment"; exit 1
      - name: Prod-safe API smoke
        env:
          # optional: set these secrets to activate the entitled-account probe
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: bash scripts/verify/api-e2e.sh --base=https://fitsy.org --prod-safe
      - name: File incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --label incident \
            --title "incident: prod smoke failed at ${RELEASE_SHA:0:7}" \
            --body "Post-deploy smoke failed for $RELEASE_SHA (see the Deploy workflow logs). ROLL BACK FIRST: \`scripts/deploy/rollback.sh api\`, diagnose second. Closing PR must add fix + detector + constraint."

  ota:
    environment: production-release
    # Trusted main release jobs coordinate with local rollback through a Git ref.
    permissions:
      contents: write
      issues: write
      statuses: read
    needs: [changes, migrate, smoke]
    # Every surviving source must pass migration and production API smoke.
    if: always() && needs.migrate.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: tok
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
      - name: Compare native inputs to the verified production iOS binary
        id: nativecheck
        run: |
          if ! node scripts/deploy/native-compatibility.mjs; then
            echo "unsafe=true" >> "$GITHUB_OUTPUT"
            echo "reason=native inputs differ from the verified iOS binary or its baseline is unavailable; ship and verify a binary before any OTA" >> "$GITHUB_OUTPUT"
          else
            echo "unsafe=false" >> "$GITHUB_OUTPUT"
          fi
      - name: File a release reminder when OTA is unsafe
        if: steps.nativecheck.outputs.unsafe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.nativecheck.outputs.reason }}
        run: |
          if gh issue list --label release --state open --search "release: OTA blocked" --json number --jq length | grep -qv '^0$'; then
            echo "open OTA-blocked issue already exists; not filing another"
          else
            gh issue create --label release \
              --title "release: OTA blocked at ${RELEASE_SHA:0:7}" \
              --body "OTA skipped: ${REASON}. Do NOT eas update until resolved." || true
          fi
          echo "OTA unsafe: ${REASON}"
      - name: Install release dependencies without release credentials
        if: steps.nativecheck.outputs.unsafe != 'true' && steps.tok.outputs.has == 'true'
        run: |
          npm ci
          npx --yes eas-cli@18 --version
      - name: Publish OTA
        if: steps.nativecheck.outputs.unsafe != 'true' && steps.tok.outputs.has == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/deploy/ota.sh "$(git log -1 --format='%h: %s')"
      - name: Missing protected EXPO_TOKEN
        if: steps.nativecheck.outputs.unsafe != 'true' && steps.tok.outputs.has == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh issue list --label release --state open --search "OTA pending" --json number --jq length | grep -qv '^0$'; then
            echo "open OTA-pending issue already exists"; exit 0
          fi
          gh issue create --label release \
            --title "release: OTA pending for ${RELEASE_SHA:0:7} (no EXPO_TOKEN in CI)" \
            --body "**TL;DR:** OTA publication stopped because the protected release token is missing. Restore EXPO_TOKEN in the production-release environment, preserve independent approval, and resume the authorized release. Native builds require their separate production-native environment copy. Do not add a repository secret." || true
      - name: File incident on OTA failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --label incident \
            --title "incident: OTA publish failed at ${RELEASE_SHA:0:7}" \
            --body "The OTA job failed for $RELEASE_SHA (see Deploy workflow logs). A partial publish is possible; verify with eas update:list, and if a broken group is live (\`scripts/deploy/rollback.sh mobile\`). Closing PR must add fix + detector + constraint." || true
