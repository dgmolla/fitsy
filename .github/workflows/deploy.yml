# Automatic routine release of the latest verified main commit.
# Sensitive maintenance and native/Apple releases retain their separate environments.
name: Deploy
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_production_ota:
        description: "Dawit approves this exact main revision for a production iOS OTA"
        type: boolean
        required: true
        default: false

run-name: 'Release ${{ github.event_name }} ${{ github.event.workflow_run.id || github.sha }}'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  checks: read
  deployments: read
  issues: write
  statuses: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.f.outputs.release_sha }}
    steps:
      # Admission code comes from this protected workflow revision, never an
      # unvalidated upstream checkout, artifact or cache.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Confirm main Verify passed
        id: f
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy/routine-release.py

  smoke:
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Vercel's existing Git integration builds, migrates and assigns domains.
      # Verify is required for release completion, not for provider build timing.
      - name: Observe the exact successful Vercel Git deployment and serving source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
        run: |
          python3 scripts/deploy/routine-release.py observe "$RELEASE_SHA" > "$RUNNER_TEMP/vercel-deployment.json"
          cat "$RUNNER_TEMP/vercel-deployment.json"
      - name: Prod-safe API smoke
        env:
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: bash scripts/verify/api-e2e.sh --base=https://fitsy.org --prod-safe
      - name: Verify serving identity after smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
        run: python3 scripts/deploy/routine-release.py health "$RELEASE_SHA" "$RUNNER_TEMP/vercel-deployment.json"
      - name: File incident on failure
        if: failure()
        env:
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy/production-incident.py

  ota:
    # Trusted main release jobs coordinate with local rollback through a Git ref.
    permissions:
      contents: write
      issues: write
      statuses: read
    needs: [changes, smoke]
    # Exact Git production build (including migration) and API smoke must pass.
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.changes.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: tok
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install release dependencies without release credentials
        run: |
          npm ci
          npx --yes eas-cli@18 --version
      - name: Compare Expo fingerprint to the verified channel iOS binary
        id: nativecheck
        run: |
          if ! node scripts/deploy/native-compatibility.mjs; then
            echo "unsafe=true" >> "$GITHUB_OUTPUT"
            echo "reason=This iOS app needs a new verified build, or its native fingerprint is missing. JavaScript updates cannot add native features. See the compatibility check above for the exact cause" >> "$GITHUB_OUTPUT"
          else
            echo "unsafe=false" >> "$GITHUB_OUTPUT"
          fi
      - name: File a release reminder when OTA is unsafe
        if: steps.nativecheck.outputs.unsafe == 'true'
        env:
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.nativecheck.outputs.reason }}
        run: |
          if gh issue list --label release --state open --search "release: OTA blocked" --json number --jq length | grep -qv '^0$'; then
            echo "open OTA-blocked issue already exists; not filing another"
          else
            gh issue create --label release \
              --title "release: OTA blocked at ${RELEASE_SHA:0:7}" \
              --body "**TL;DR:** OTA is blocked; a new verified iOS build or its fingerprint is needed. ${REASON}. Follow docs/engineering/devops/ios-ota-baseline.md before resuming." || true
          fi
          echo "OTA unsafe: ${REASON}"
      - name: Publish OTA
        if: steps.nativecheck.outputs.unsafe != 'true' && steps.tok.outputs.has == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/deploy/ota.sh "$(git log -1 --format='%h: %s')"
      - name: Missing protected EXPO_TOKEN
        if: steps.nativecheck.outputs.unsafe != 'true' && steps.tok.outputs.has == 'false'
        env:
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh issue list --label release --state open --search "OTA pending" --json number --jq length | grep -qv '^0$'; then
            echo "open OTA-pending issue already exists"; exit 1
          fi
          gh issue create --label release \
            --title "release: OTA pending for ${RELEASE_SHA:0:7} (no EXPO_TOKEN in CI)" \
            --body "**TL;DR:** OTA publication stopped because EXPO_TOKEN is missing from the existing CI route. Restore the authorized credential and resume the release. Native builds retain their separate production-native protection." || true
          exit 1
      - name: File incident on OTA failure
        if: failure()
        env:
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --label incident \
            --title "incident: OTA publish failed at ${RELEASE_SHA:0:7}" \
            --body "The OTA job failed for $RELEASE_SHA (see Deploy workflow logs). A partial publish is possible; verify with eas update:list, and if a broken group is live (\`scripts/deploy/rollback.sh mobile\`). Closing PR must add fix + detector + constraint." || true

  production-ota:
    # Automatic OTA targets TestFlight. App Store production updates retain
    # their separate binary baseline and use only this approved route.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'dgmolla' && inputs.approve_production_ota
    environment: production-native
    permissions:
      contents: write
      issues: write
      actions: read
      deployments: read
      statuses: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install release dependencies without release credentials
        run: |
          npm ci
          npx --yes eas-cli@18 --version
      - name: Require approved current main and successful Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy/manual-ota-release.py
      - name: Observe the exact successful Vercel deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy/routine-release.py observe "$GITHUB_SHA" > "$RUNNER_TEMP/vercel-deployment.json"
      - name: Prod-safe API smoke
        env:
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: bash scripts/verify/api-e2e.sh --base=https://fitsy.org --prod-safe
      - name: Verify serving identity after smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy/routine-release.py health "$GITHUB_SHA" "$RUNNER_TEMP/vercel-deployment.json"
      - name: Publish approved production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/deploy/ota.sh --manual-production "$(git log -1 --format='%h: %s')"
