# Automatic routine release of one independently reviewed protected main tree.
# Sensitive maintenance and native/Apple releases retain their separate environments.
name: Deploy
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

run-name: 'Release Verify ${{ github.event.workflow_run.id }}'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  checks: read
  issues: write
  statuses: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.f.outputs.release_sha }}
    steps:
      # Admission code comes from this protected workflow revision, never an
      # unvalidated upstream checkout, artifact or cache.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate exact main Verify and independently reviewed PR provenance
        id: f
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy/routine-release.py

  migrate:
    environment: routine-production
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install without production credentials
        run: npm ci
      - name: Confirm current source before production mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
        run: python3 scripts/deploy/routine-release.py current "$RELEASE_SHA"
      # Always reconcile pending tracked migrations, including replaced pushes.
      # Structural SQL safety and independent migration review still apply.
      - name: Migrate production
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: bash scripts/deploy/migrate-prod.sh
      - name: File incident on failure
        if: failure()
        env:
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --label incident --title "incident: prod migration failed at ${RELEASE_SHA:0:7}" \
            --body "**TL;DR:** Production migration stopped and promotion remains withheld. Inspect Deploy logs for $RELEASE_SHA; diagnose before resuming. Closing PR must add fix, detector and constraint."

  smoke:
    environment: routine-production
    needs: [changes, migrate]
    if: always() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned provider CLI without production credentials
        run: npm install --prefix "$RUNNER_TEMP/vercel-cli" --ignore-scripts --no-audit --no-fund vercel@50.37.0
      - name: Stage immutable production build without assigning domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
        run: |
          export VERCEL_CLI="$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel"
          python3 scripts/deploy/vercel-release.py stage "$RELEASE_SHA" "$RUNNER_TEMP/vercel-release.json"
      - name: Promote only the verified target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export VERCEL_CLI="$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel"
          python3 scripts/deploy/vercel-release.py promote "$RUNNER_TEMP/vercel-release.json"
      - name: Verify serving identity before smoke
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 scripts/deploy/vercel-release.py verify "$RUNNER_TEMP/vercel-release.json"
      - name: Prod-safe API smoke
        env:
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: bash scripts/verify/api-e2e.sh --base=https://fitsy.org --prod-safe
      - name: Verify serving identity after smoke
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 scripts/deploy/vercel-release.py verify "$RUNNER_TEMP/vercel-release.json"
      - name: Retain exact target and previous serving target
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-release-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-release.json
          if-no-files-found: ignore
      - name: File incident on failure
        if: failure()
        env:
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --label incident --title "incident: prod release failed at ${RELEASE_SHA:0:7}" \
            --body "**TL;DR:** Production release stopped; inspect the retained target receipt before resuming. Read the actual fitsy.org alias before retrying any uncertain mutation. If promotion occurred and health failed, roll back using the receipt's previous_url: scripts/deploy/rollback.sh api https://PREVIOUS_URL. Source $RELEASE_SHA; see Deploy logs."

  ota:
    environment: routine-production
    # Trusted main release jobs coordinate with local rollback through a Git ref.
    permissions:
      contents: write
      issues: write
      statuses: read
    needs: [changes, migrate, smoke]
    # Every surviving source must pass migration and production API smoke.
    if: always() && needs.migrate.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.changes.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: tok
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
      - name: Compare native inputs to the verified production iOS binary
        id: nativecheck
        run: |
          if ! node scripts/deploy/native-compatibility.mjs; then
            echo "unsafe=true" >> "$GITHUB_OUTPUT"
            echo "reason=native inputs differ from the verified iOS binary or its baseline is unavailable; ship and verify a binary before any OTA" >> "$GITHUB_OUTPUT"
          else
            echo "unsafe=false" >> "$GITHUB_OUTPUT"
          fi
      - name: File a release reminder when OTA is unsafe
        if: steps.nativecheck.outputs.unsafe == 'true'
        env:
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.nativecheck.outputs.reason }}
        run: |
          if gh issue list --label release --state open --search "release: OTA blocked" --json number --jq length | grep -qv '^0$'; then
            echo "open OTA-blocked issue already exists; not filing another"
          else
            gh issue create --label release \
              --title "release: OTA blocked at ${RELEASE_SHA:0:7}" \
              --body "OTA skipped: ${REASON}. Do NOT eas update until resolved." || true
          fi
          echo "OTA unsafe: ${REASON}"
      - name: Install release dependencies without release credentials
        if: steps.nativecheck.outputs.unsafe != 'true' && steps.tok.outputs.has == 'true'
        run: |
          npm ci
          npx --yes eas-cli@18 --version
      - name: Publish OTA
        if: steps.nativecheck.outputs.unsafe != 'true' && steps.tok.outputs.has == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/deploy/ota.sh "$(git log -1 --format='%h: %s')"
      - name: Missing protected EXPO_TOKEN
        if: steps.nativecheck.outputs.unsafe != 'true' && steps.tok.outputs.has == 'false'
        env:
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh issue list --label release --state open --search "OTA pending" --json number --jq length | grep -qv '^0$'; then
            echo "open OTA-pending issue already exists"; exit 1
          fi
          gh issue create --label release \
            --title "release: OTA pending for ${RELEASE_SHA:0:7} (no EXPO_TOKEN in CI)" \
            --body "**TL;DR:** OTA publication stopped because the protected release token is missing. Restore EXPO_TOKEN in the routine-production environment and resume the authorized release. Native builds require their separate production-native environment copy. Do not add a repository secret." || true
          exit 1
      - name: File incident on OTA failure
        if: failure()
        env:
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --label incident \
            --title "incident: OTA publish failed at ${RELEASE_SHA:0:7}" \
            --body "The OTA job failed for $RELEASE_SHA (see Deploy workflow logs). A partial publish is possible; verify with eas update:list, and if a broken group is live (\`scripts/deploy/rollback.sh mobile\`). Closing PR must add fix + detector + constraint." || true
