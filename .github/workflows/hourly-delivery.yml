name: Delivery report diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: fitsy-hourly-delivery
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: delivery-report
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate delivery report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_GITHUB_TOKEN: ${{ secrets.DELIVERY_GITHUB_TOKEN }}
        run: |
          node scripts/delivery/hourly-report.mjs --output-dir work/hourly-delivery-report --dry-run
      - name: Preserve report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-delivery-${{ github.run_id }}
          path: work/hourly-delivery-report/
          if-no-files-found: warn
          retention-days: 30
