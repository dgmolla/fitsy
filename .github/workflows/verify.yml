# The verification pipeline. Replaces ci.yml + reviewer.yml (2026-09-07).
# Every job is a thin caller of scripts/verify/run.mjs, which reads
# scripts/verify/registry.yml — the single list of checks. The pre-push hook
# and agents run the same scripts locally. Design:
# docs/engineering/devops/autonomous-shipping.md
name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Resolve the actual event range once through the same impact plan used
  # locally. Main pushes use before/after, including every commit in a batch.
  classify:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.t.outputs.code }}
      tests: ${{ steps.t.outputs.tests }}
      build: ${{ steps.t.outputs.build }}
      docs_only: ${{ steps.t.outputs.docs_only }}
      simulator: ${{ steps.t.outputs.simulator }}
      sim_scope: ${{ steps.t.outputs.sim_scope }}
      sim_mode: ${{ steps.t.outputs.sim_mode }}
      sim_smoke: ${{ steps.t.outputs.sim_smoke }}
      sim_flows: ${{ steps.t.outputs.sim_flows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - id: t
        # The shared planner distinguishes verification wiring from native inputs;
        # a verification-only PR must not request simulator service credentials.
        run: node scripts/verify/impact-plan.mjs --github-output
      - name: Install gitleaks (docs PRs can leak secrets too)
        run: curl -sL "$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep browser_download_url | grep linux_x64.tar.gz | head -1 | cut -d '"' -f4)" | tar xz -C /usr/local/bin gitleaks || echo "gitleaks install failed; grep fallback covers"
      - name: Baseline checks (always, no npm ci)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          bash scripts/verify/structural.sh
          bash scripts/verify/secrets.sh
          bash scripts/verify/context-freshness.sh
          bash scripts/verify/size-check.sh || { c=$?; [ "$c" -eq 2 ] || exit 1; }

  static:
    needs: classify
    if: needs.classify.outputs.code == 'true'
    name: Static (L0-L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install required workflow lint tools
        run: |
          curl --fail --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C /usr/local/bin actionlint
          curl --fail --show-error --location --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C /usr/local/bin --strip-components=1 shellcheck-v0.11.0/shellcheck
          actionlint --version
          shellcheck --version
      - name: Install gitleaks
        run: |
          curl -sL "$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep browser_download_url | grep linux_x64.tar.gz | head -1 | cut -d '"' -f4)" | tar xz -C /usr/local/bin gitleaks || echo "gitleaks install failed; grep fallback covers"
      - name: Fetch main for diff scope
        run: git fetch origin main
      - name: Run L0-L1 checks (minus domain-check)
        run: node scripts/verify/run.mjs --layer=0-1 --runs=ci --scope=changed
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  domain-check:
    name: Single-domain PR check # Preserve the required status context while reporting cross-layer scope.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: git fetch origin main
      - name: Report PR domains
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # bash-only check; exit 2 = skipped (no diff), which must not fail the job
        run: bash scripts/verify/domain-check.sh || { c=$?; [ "$c" -eq 2 ] || exit 1; }
      - name: Comment on classification failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "**domain-check** could not resolve the PR head, comparison history, or reviewed routing table. Restore that context and rerun the check." || true

  test:
    needs: [classify, static]
    if: needs.classify.outputs.tests == 'true'
    name: Tests (L2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fitsy_test
          POSTGRES_PASSWORD: fitsy_test
          POSTGRES_DB: fitsy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PRISMA_URL: postgresql://fitsy_test:fitsy_test@localhost:5432/fitsy_test
      POSTGRES_URL_NON_POOLING: postgresql://fitsy_test:fitsy_test@localhost:5432/fitsy_test
      # External API keys intentionally absent — tests must mock all external services
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: git fetch origin main
      - name: Apply Prisma migrations (ephemeral DB)
        run: npx prisma migrate deploy
      - name: Seed fixture data (deterministic; no auth users in CI)
        run: npx tsx prisma/seed.ts --data-only
      - name: Run L2 checks
        run: node scripts/verify/run.mjs --layer=2 --runs=ci --scope=changed

  build:
    needs: [classify, static]
    # A docs-only needs-sim override can run after the correctly skipped static
    # job. Every code change still requires successful static validation.
    if: >-
      always() && needs.classify.result == 'success' &&
      needs.classify.outputs.build == 'true' &&
      ((needs.classify.outputs.code == 'true' && needs.static.result == 'success') ||
       (needs.classify.outputs.code == 'false' && needs.static.result == 'skipped'))
    name: Build (L3)
    runs-on: ${{ needs.classify.outputs.simulator == 'true' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: git fetch origin main
      - name: Run L3 checks
        if: needs.classify.outputs.code == 'true'
        run: node scripts/verify/run.mjs --layer=3 --runs=ci --scope=changed
      - uses: actions/setup-java@v4
        if: needs.classify.outputs.simulator == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        if: needs.classify.outputs.simulator == 'true'
        run: brew install mobile-dev-inc/tap/maestro
      - name: Run selected simulator flows
        if: needs.classify.outputs.simulator == 'true'
        env:
          FITSY_CI_SIM_SCOPE: ${{ needs.classify.outputs.sim_scope }}
          FITSY_CI_SIM_MODE: ${{ needs.classify.outputs.sim_mode }}
          FITSY_CI_SIM_SMOKE: ${{ needs.classify.outputs.sim_smoke }}
          FITSY_CI_SIM_FLOWS: ${{ needs.classify.outputs.sim_flows }}
          EXPO_PUBLIC_API_URL: https://dev.fitsy.org
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.FITSY_SIM_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.FITSY_SIM_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_REVENUECAT_TEST_KEY: ${{ vars.FITSY_SIM_REVENUECAT_TEST_KEY }}
          EXPO_PUBLIC_DEV_LOGIN_EMAIL: ${{ vars.FITSY_SIM_LOGIN_EMAIL }}
          EXPO_PUBLIC_DEV_LOGIN_PASSWORD: ${{ secrets.FITSY_SIM_LOGIN_PASSWORD }}
          FITSY_SIM_EXPIRED_LOGIN_EMAIL: ${{ vars.FITSY_SIM_EXPIRED_LOGIN_EMAIL }}
          FITSY_SIM_EXPIRED_LOGIN_PASSWORD: ${{ secrets.FITSY_SIM_EXPIRED_LOGIN_PASSWORD }}
        run: node scripts/verify/run.mjs --only=mobile-e2e --runs=ci --scope=changed
      - name: Preserve simulator logs and screenshots
        if: always() && needs.classify.outputs.simulator == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-simulator-${{ github.run_attempt }}
          path: |
            .evidence/mobile-e2e/
            .evidence/product-build/build.log
            .evidence/product-build/metro.log
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify
    needs: [classify, static, domain-check, test, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e --arg event "$GITHUB_EVENT_NAME" '
            def expected($flag):
              if $flag == "true" then "success"
              elif $flag == "false" then "skipped" else "invalid" end;
            .classify.result == "success" and
            .static.result == expected(.classify.outputs.code) and
            .test.result == expected(.classify.outputs.tests) and
            .build.result == expected(.classify.outputs.build) and
            ."domain-check".result == (if $event == "pull_request" then "success" else "skipped" end)
          ' <<<"$NEEDS_JSON"
