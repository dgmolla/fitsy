# The verification pipeline. Replaces ci.yml + reviewer.yml (2026-09-07).
# Every job is a thin caller of scripts/verify/run.mjs, which reads
# scripts/verify/registry.yml — the single list of checks. The pre-push hook
# and agents run the same scripts locally. Design:
# docs/engineering/devops/autonomous-shipping.md
name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Resolve the actual event range once through the same impact plan used
  # locally. Main pushes use before/after, including every commit in a batch.
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.t.outputs.code }}
      tests: ${{ steps.t.outputs.tests }}
      build: ${{ steps.t.outputs.build }}
      docs_only: ${{ steps.t.outputs.docs_only }}
      simulator: ${{ steps.t.outputs.simulator }}
      media: ${{ steps.media.outputs.media }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: t
        run: node scripts/verify/impact-plan.mjs --github-output
      # #846 follow-up (AI review, CONFIRMED P2): a change needing no
      # simulator work can still require local media-integration evidence.
      # Both imports resolve to the dependency-free impact-plan.mjs (classify
      # never runs npm ci) - media-integration.mjs re-exports the same
      # function but also imports product-flow.mjs's chain down to
      # screen-guard.mjs's js-yaml require, which isn't installed here.
      # A real node failure must fail the job, not silently default: piping
      # a crashing command through `echo "x=$(...)"` swallows its exit code.
      - id: media
        run: |
          node --input-type=module -e "
            import { changedFiles, mediaIntegrationRequired } from './scripts/verify/impact-plan.mjs';
            const { files } = changedFiles();
            console.log('media=' + (files ? mediaIntegrationRequired(files) : true));
          " >> "$GITHUB_OUTPUT"
      # Candidate scripts and baseline checks receive read-only access.
      - name: Install gitleaks (docs PRs can leak secrets too)
        run: curl -sL "$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep browser_download_url | grep linux_x64.tar.gz | head -1 | cut -d '"' -f4)" | tar xz -C /usr/local/bin gitleaks || echo "gitleaks install failed; grep fallback covers"
      - name: Baseline checks (always, no npm ci)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          bash scripts/verify/structural.sh
          bash scripts/verify/secrets.sh
          bash scripts/verify/context-freshness.sh
          bash scripts/verify/size-check.sh || { c=$?; [ "$c" -eq 2 ] || exit 1; }

  static:
    needs: classify
    if: needs.classify.outputs.code == 'true'
    name: Static (L0-L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Release downloads have returned HTTP 504; reuse the pinned archives and
      # check their SHA-256 on every run, cached or downloaded.
      - name: Restore pinned workflow lint tool archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lint-tools
          key: lint-tools-actionlint-1.7.12-8aca8db9-shellcheck-0.11.0-8c3be12b
      - name: Install required workflow lint tools
        run: |
          dir="$RUNNER_TEMP/lint-tools"
          mkdir -p "$dir"
          [ -f "$dir/actionlint.tar.gz" ] || curl --fail --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $dir/actionlint.tar.gz" | sha256sum --check
          tar xzf "$dir/actionlint.tar.gz" -C /usr/local/bin actionlint
          [ -f "$dir/shellcheck.tar.xz" ] || curl --fail --show-error --location --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$dir/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $dir/shellcheck.tar.xz" | sha256sum --check
          tar xJf "$dir/shellcheck.tar.xz" -C /usr/local/bin --strip-components=1 shellcheck-v0.11.0/shellcheck
          actionlint --version
          shellcheck --version
      - name: Install gitleaks
        run: |
          curl -sL "$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep browser_download_url | grep linux_x64.tar.gz | head -1 | cut -d '"' -f4)" | tar xz -C /usr/local/bin gitleaks || echo "gitleaks install failed; grep fallback covers"
      - name: Fetch main for diff scope
        run: git fetch origin main
      - name: Run L0-L1 checks (minus domain-check)
        run: node scripts/verify/run.mjs --layer=0-1 --runs=ci --scope=changed
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload L0-L1 diagnostics
        if: ${{ always() }}
        # A transient artifact-service outage must not fail an otherwise-passing job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verify-l0-l1-logs-attempt-${{ github.run_attempt }}
          path: .evidence/verify/logs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # #843: product-flow/local is a required check, but it's only ever posted
  # by the app lane's local Maestro walkthrough for a PR that actually
  # touches the mobile app - a tooling/docs/marketing PR would otherwise
  # wait forever on a status that never arrives once it's required. This
  # job posts the same "not applicable" disposition
  # scripts/sim/publish-product-flow.mjs already uses for that exact case,
  # using only classify's own already-computed output value - never
  # checking out or executing any PR-branch code - so the statuses:write
  # permission it needs never runs alongside untrusted code, unlike
  # classify itself, which stays read-only.
  mark-non-product:
    name: product-flow/local (non-product)
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.simulator != 'true' && needs.classify.outputs.media != 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mark product-flow/local not applicable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" --input - <<< \
            '{"state":"success","context":"product-flow/local","description":"Not applicable: no mobile-facing product changes"}'

  domain-check:
    name: Single-domain PR check # Preserve the required status context while reporting cross-layer scope.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: git fetch origin main
      - name: Report PR domains
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # bash-only check; exit 2 = skipped (no diff), which must not fail the job
        run: bash scripts/verify/domain-check.sh || { c=$?; [ "$c" -eq 2 ] || exit 1; }
      - name: Comment on classification failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "**domain-check** could not resolve the PR head, comparison history, or reviewed routing table. Restore that context and rerun the check." || true

  test:
    needs: [classify, static]
    # Main pushes always run the full suite, including documentation-only pushes.
    if: >-
      always() && needs.classify.result == 'success' &&
      needs.classify.outputs.tests == 'true' &&
      ((needs.classify.outputs.code == 'true' && needs.static.result == 'success') ||
       (needs.classify.outputs.code == 'false' && needs.static.result == 'skipped'))
    name: Tests (L2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [api, scripts, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: git fetch origin main
      # The canonical runner owns PostGIS, target checks, migrations and seed.
      # External API keys stay absent; tests replace external services.
      # Each shard runs only its own group (same commands/worker limits as the
      # unsharded run) in parallel with the others; a shard whose group isn't
      # affected by this change reports skipped and exits 0, not failed.
      - name: Run L2 checks
        env:
          FITSY_VERIFY_TEST_GROUP: ${{ matrix.group }}
        run: node scripts/verify/run.mjs --layer=2 --runs=ci --scope=changed --only=test
      - name: Upload L2 diagnostics
        if: ${{ always() }}
        # A transient artifact-service outage must not fail an otherwise-passing job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verify-l2-logs-attempt-${{ github.run_attempt }}-${{ matrix.group }}
          path: .evidence/verify/logs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  test-other:
    needs: [classify, static]
    if: >-
      always() && needs.classify.result == 'success' &&
      needs.classify.outputs.tests == 'true' &&
      ((needs.classify.outputs.code == 'true' && needs.static.result == 'success') ||
       (needs.classify.outputs.code == 'false' && needs.static.result == 'skipped'))
    name: Tests (L2 other)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: git fetch origin main
      # The two L2 checks not sharded by test group: small and fast relative
      # to the api/scripts/mobile suites, so they stay on one runner.
      - name: Run remaining L2 checks
        run: node scripts/verify/run.mjs --layer=2 --runs=ci --scope=changed --only=own-code-mocks,rate-limit-store
      - name: Upload L2 diagnostics
        if: ${{ always() }}
        # A transient artifact-service outage must not fail an otherwise-passing job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verify-l2-other-logs-attempt-${{ github.run_attempt }}
          path: .evidence/verify/logs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  build:
    needs: [classify, static]
    # Builds retain code applicability; simulator execution belongs to the Mac.
    if: >-
      always() && needs.classify.result == 'success' &&
      needs.classify.outputs.build == 'true' &&
      ((needs.classify.outputs.code == 'true' && needs.static.result == 'success') ||
       (needs.classify.outputs.code == 'false' && needs.static.result == 'skipped'))
    name: Build (L3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: git fetch origin main
      - name: Run L3 checks
        if: needs.classify.outputs.code == 'true'
        run: node scripts/verify/run.mjs --layer=3 --runs=ci --scope=changed
      - name: Upload L3 diagnostics
        if: ${{ always() }}
        # A transient artifact-service outage must not fail an otherwise-passing job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verify-l3-logs-attempt-${{ github.run_attempt }}
          path: .evidence/verify/logs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  verify:
    name: Verify
    needs: [classify, static, domain-check, test, test-other, build, mark-non-product]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e --arg event "$GITHUB_EVENT_NAME" '
            def expected($flag):
              if $flag == "true" then "success"
              elif $flag == "false" then "skipped" else "invalid" end;
            .classify.result == "success" and
            .static.result == expected(.classify.outputs.code) and
            .test.result == expected(.classify.outputs.tests) and
            ."test-other".result == expected(.classify.outputs.tests) and
            .build.result == expected(.classify.outputs.build) and
            ."domain-check".result == (if $event == "pull_request" then "success" else "skipped" end) and
            ."mark-non-product".result == (if $event == "pull_request" and .classify.outputs.simulator != "true" and .classify.outputs.media != "true" then "success" else "skipped" end)
          ' <<<"$NEEDS_JSON"
