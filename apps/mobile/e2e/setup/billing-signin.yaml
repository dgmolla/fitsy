# Hosted runner selects and verifies the account before serving this bundle.
# The original acceptance flows retain their prepared-state contracts locally.
appId: com.fitsy.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible:
          id: welcome-start
- waitForAnimationToEnd
- tapOn:
    point: "92%,93%"
- openLink: com.fitsy.mobile://welcome/payment
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- tapOn: "Dev login"
