appId: com.fitsy.mobile
tags:
  - 'fixture:entitled-dev'
  - 'store:test-store'
  - auth
  - billing
  - discovery
  - changed-journey
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- evalScript: ${output.apiPaths = ['/api/restaurants?lat=34.0522&lng=-118.2437&radius=5']}
- runScript: ../helpers/data-api.mjs
- assertTrue:
    condition: ${output.dataApiLoginStatus === 200 && output.dataApiUnauthStatus === 401 && output.dataApiInvalidStatus === 401}
    label: "Candidate at ${EXPO_PUBLIC_API_URL} must reject missing/invalid sessions (HTTP ${output.dataApiUnauthStatus}/${output.dataApiInvalidStatus}, expected 401/401); fixture login must succeed (HTTP ${output.dataApiLoginStatus}, expected 200)"
- assertTrue: ${output.dataApiResponses[0].status === 200}
- evalScript: ${output.seed = json(output.dataApiResponses[0].body).data[0]}
- assertTrue: ${!!output.seed}
- evalScript: ${output.apiPaths = ['/api/restaurants/' + output.seed.id + '/menu']}
- runScript: ../helpers/data-api.mjs
- assertTrue:
    condition: ${output.dataApiLoginStatus === 200 && output.dataApiUnauthStatus === 401 && output.dataApiInvalidStatus === 401}
    label: "Candidate at ${EXPO_PUBLIC_API_URL} must reject missing/invalid sessions (HTTP ${output.dataApiUnauthStatus}/${output.dataApiInvalidStatus}, expected 401/401); fixture login must succeed (HTTP ${output.dataApiLoginStatus}, expected 200)"
- assertTrue: ${output.dataApiResponses[0].status === 200}
- evalScript: ${output.menu = json(output.dataApiResponses[0].body).data}
- assertTrue: ${!output.menu.locked}
- evalScript: ${output.meal = output.menu.menuItems.filter(function (m) { return !!m.macros; })[0]}
- assertTrue: ${!!output.meal}
- launchApp
# Reset only this controlled DEV account's bookmarks through the Saved screen.
# Each removal must change the visible count, and the bounded setup must finish empty.
- openLink: com.fitsy.mobile://saved
- tapOn:
    text: '^Open$'
    optional: true
- extendedWaitUntil:
    visible:
      id: saved-content
    timeout: 30000
- runFlow:
    when:
      visible: Remove bookmark
    commands:
      - repeat:
          times: 10
          while:
            visible: Remove bookmark
          commands:
            - copyTextFrom:
                text: '^[0-9]+$'
            - evalScript: ${output.savedCount = maestro.copiedText}
            - tapOn:
                text: Remove bookmark
                index: 0
            - extendedWaitUntil:
                notVisible:
                  text: ${'^' + output.savedCount + '$'}
                timeout: 15000
- assertVisible: '(?s)No saved meals yet.*'
- openLink: ${'com.fitsy.mobile://restaurant/' + output.seed.id + '?selectedItemId=' + output.meal.id + '&saveSelected=1'}
- tapOn:
    text: '^Open$'
    optional: true
- extendedWaitUntil:
    visible:
      id: menu-search
    timeout: 30000
- assertVisible:
    id: ${'menu-item-' + output.meal.id}
- assertNotVisible: '.*dish name hidden, view plans to find this meal.*'
- takeScreenshot: unlocked-macro-menu
- openLink: com.fitsy.mobile://saved
- tapOn:
    text: '^Open$'
    optional: true
- extendedWaitUntil:
    visible:
      id: ${'saved-restaurant-' + output.seed.id}
    timeout: 15000
- assertVisible: '^1$'
- assertVisible: Remove bookmark
- takeScreenshot: saved-continuation
