# Precondition: this signed-in Fitsy account has a real subscription that has
# expired in the configured store. Test Store supports this same-account case.
appId: com.fitsy.mobile
tags: [billing, onboarding, changed-journey, 'fixture:expired-subscription', 'store:test-store', 'store:apple-simulator']
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Welcome back."
    timeout: 30000
- assertVisible:
    id: resubscribe-restore
- assertVisible: "Sample meal"
- assertVisible:
    id: paywall-search-item-card
    text: "Chick-fil-A, best match: 8 ct Grilled Nuggets"
- assertNotVisible:
    id: paywall-logo
- tapOn:
    id: resubscribe-restore
- extendedWaitUntil:
    visible: "Subscription ended"
    timeout: 30000
- assertNotVisible: "Nothing to restore"
- tapOn: "OK"
- assertVisible: "Welcome back."
- takeScreenshot: subscription-expired-restore
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Welcome back."
    timeout: 30000
- assertVisible:
    id: resubscribe-restore
- assertVisible: "Sample meal"
- assertVisible:
    id: paywall-search-item-card
- assertNotVisible:
    id: paywall-logo
- takeScreenshot: subscription-expired-relaunch
# Signing the same expired account back in must return to the bundled sample
# on win-back, without a restaurant request or discovery recovery.
- openLink: com.fitsy.mobile://welcome/signin?returnTo=resubscribe
- tapOn:
    text: "^Open$"
    optional: true
- runFlow:
    file: ../helpers/discovery-signin.yaml
    env:
      DESTINATION: resubscribe-restore
- assertVisible: "Welcome back."
- assertVisible: "Sample meal"
- assertVisible:
    id: paywall-search-item-card
- assertNotVisible:
    id: paywall-logo
- assertNotVisible:
    id: preview-guide
- takeScreenshot: subscription-expired-signin-return
