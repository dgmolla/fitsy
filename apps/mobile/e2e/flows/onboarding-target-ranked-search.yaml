# Real dev coverage: full targets rank pizza and preserve all five tour tips.
appId: com.fitsy.mobile
tags: ['fixture:unsubscribed-dev', 'store:test-store', discovery, onboarding, changed-journey]
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
# XCTest can reject the first AX snapshot after reinstall (HTTP 500).
# A cleared Debug client can also return to the Development Build launcher.
# Retry startup only, opening local Metro before observing guest readiness.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- waitForAnimationToEnd
- tapOn:
    point: "92%,93%"
- tapOn:
    id: welcome-start
- runFlow:
    file: ../helpers/discovery-signin.yaml
    env:
      DESTINATION: "^location-(use-current|continue-area)$"
- assertVisible:
    id: location-use-current
- assertVisible:
    id: location-choose-area
- tapOn:
    id: location-choose-area
# On a small iPhone, DTLA exists in accessibility but sits below the visible sheet.
- swipe:
    start: "50%,78%"
    end: "50%,47%"
- tapOn: "Search near DTLA"
- extendedWaitUntil:
    visible:
      id: goal-lose_fat
    timeout: 30000
- assertVisible: "What's your goal.*"
- tapOn:
    id: goal-lose_fat
- tapOn:
    id: welcome-continue
- extendedWaitUntil:
    visible:
      id: tried-calorie_apps
    timeout: 30000
- assertVisible: "What have you tried.*for healthy eating.*"
# The native option groups its emoji and label into one accessible button.
- assertVisible:
    id: tried-meal_prep
    text: ".*Meal prepping at home.*"
- tapOn:
    id: tried-calorie_apps
- tapOn:
    id: welcome-continue
- assertVisible: "That restaurant dish.*can be hard to find.*"
- assertVisible:
    id: story-calorie_apps
- tapOn:
    id: welcome-continue
- assertVisible:
    id: goal-progress-graph
- assertVisible: ".*beyond tracker entries.*"
- assertVisible: "Consistency with your fat-loss plan"
- assertVisible: "With Fitsy"
- assertVisible: "Without Fitsy"
- tapOn:
    id: welcome-continue
- tapOn:
    id: target-mode-known
- tapOn:
    id: welcome-continue
- assertVisible: "What works.*for one meal.*"
- tapOn:
    id: meal-target-calories
- waitForAnimationToEnd
- eraseText: 7
- inputText: "500"
- copyTextFrom:
    id: meal-target-calories
- assertTrue: ${maestro.copiedText === '500'}
# Settle the previous field before focusing the next one. Generated grams can
# invalidate the native selection, so explicitly replace each field's value.
- tapOn:
    text: "Protein / meal"
- waitForAnimationToEnd
- tapOn:
    id: meal-target-protein
- waitForAnimationToEnd
- eraseText: 7
- inputText: "50"
- copyTextFrom:
    id: meal-target-protein
- assertTrue: ${maestro.copiedText === '50'}
- swipe:
    start: "50%,46%"
    end: "50%,25%"
- waitForAnimationToEnd
- tapOn:
    text: "Carbs / meal"
- waitForAnimationToEnd
- tapOn:
    id: meal-target-carbs
- waitForAnimationToEnd
- eraseText: 7
- inputText: "44"
- copyTextFrom:
    id: meal-target-carbs
- assertTrue: ${maestro.copiedText === '44'}
- tapOn:
    text: "Fat / meal"
- waitForAnimationToEnd
- tapOn:
    id: meal-target-fat
- waitForAnimationToEnd
- eraseText: 7
- inputText: "14"
- copyTextFrom:
    id: meal-target-fat
- assertTrue: ${maestro.copiedText === '14'}
# Save with the final decimal keyboard open, then read the persisted allocation.
# Whole grams settle to 502 kcal, rather than the original 500 kcal draft.
- tapOn:
    id: welcome-continue
- assertVisible: "A little context.*A better choice.*"
- tapOn:
    id: welcome-back
- evalScript: ${output.targets = {}}
- copyTextFrom:
    id: meal-target-calories
- evalScript: ${output.targets.calories = Number(maestro.copiedText)}
- copyTextFrom:
    id: meal-target-protein
- evalScript: ${output.targets.protein = Number(maestro.copiedText)}
- copyTextFrom:
    id: meal-target-carbs
- evalScript: ${output.targets.carbs = Number(maestro.copiedText)}
- copyTextFrom:
    id: meal-target-fat
- evalScript: ${output.targets.fat = Number(maestro.copiedText)}
- assertTrue: ${output.targets.calories === 502 && output.targets.protein === 50 && output.targets.carbs === 44 && output.targets.fat === 14}
- assertTrue: ${output.targets.calories === 4 * output.targets.protein + 4 * output.targets.carbs + 9 * output.targets.fat}
# Compare native results with the live ranked query while all four targets remain set.
- evalScript: ${output.rankedUrl = 'https://dev.fitsy.org/api/restaurants/preview?guided=1&lat=34.0407&lng=-118.2468&calories=' + output.targets.calories + '&protein=' + output.targets.protein + '&carbs=' + output.targets.carbs + '&fat=' + output.targets.fat}
- evalScript: ${output.apiPaths = [output.rankedUrl]}
- runScript: ../helpers/data-api.mjs
- assertTrue:
    condition: ${output.dataApiLoginStatus === 200 && output.dataApiUnauthStatus === 401 && output.dataApiInvalidStatus === 401}
    label: "Candidate at dev.fitsy.org must reject missing/invalid sessions (HTTP ${output.dataApiUnauthStatus}/${output.dataApiInvalidStatus}, expected 401/401); fixture login must succeed (HTTP ${output.dataApiLoginStatus}, expected 200)"
- evalScript: ${output.baseResponse = output.dataApiResponses[0]}
- assertTrue: ${output.baseResponse.status === 200}
- evalScript: ${output.base = json(output.baseResponse.body)}
- assertTrue: ${output.base.data.length > 0}
- evalScript: ${output.apiPaths = [output.rankedUrl + '&q=pizza']}
- runScript: ../helpers/data-api.mjs
- assertTrue:
    condition: ${output.dataApiLoginStatus === 200 && output.dataApiUnauthStatus === 401 && output.dataApiInvalidStatus === 401}
    label: "Candidate at dev.fitsy.org must reject missing/invalid sessions (HTTP ${output.dataApiUnauthStatus}/${output.dataApiInvalidStatus}, expected 401/401); fixture login must succeed (HTTP ${output.dataApiLoginStatus}, expected 200)"
- evalScript: ${output.pizzaResponse = output.dataApiResponses[0]}
- assertTrue: ${output.pizzaResponse.status === 200}
- evalScript: ${output.pizza = json(output.pizzaResponse.body)}
- assertTrue: ${output.pizza.data.length > 0}
# A matching UI and API response alone would pass if both ignored the query.
# This real dev fixture independently anchors the ranked result to a pizza dish.
- assertTrue: ${output.pizza.data[0].name === 'Pizza Roma' && output.pizza.data[0].bestMatch.name === 'Buffalo Chicken  Pizza'}
- tapOn:
    id: welcome-continue
- assertVisible: "A little context.*A better choice.*"
- tapOn:
    id: welcome-continue
- extendedWaitUntil:
    visible:
      id: coachmark-next
    timeout: 30000
- assertVisible: "1 OF 5"
- assertVisible: "Your meal targets"
- tapOn:
    id: coachmark-skip
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- copyTextFrom:
    id: discovery-hero
- assertTrue: ${maestro.copiedText.includes(output.base.data[0].name) && maestro.copiedText.includes(output.base.data[0].bestMatch.name)}
- assertNotVisible:
    id: discovery-clear-search
# Replay starts on confirmed, real dishes. The demo then types pizza itself.
- tapOn:
    id: preview-show-tour
- assertVisible: "1 OF 5"
- assertVisible: "Your meal targets"
- tapOn:
    id: coachmark-next
- assertVisible: "2 OF 5"
- assertVisible: "Follow your craving"
- extendedWaitUntil:
    visible:
      id: coachmark-next
      enabled: true
    timeout: 30000
- tapOn:
    id: coachmark-next
- assertVisible: "3 OF 5"
- assertVisible: "Real meals. Know the source."
- tapOn:
    id: coachmark-next
- assertVisible: "4 OF 5"
- assertVisible: "Wherever your day takes you"
- tapOn:
    id: coachmark-next
- assertVisible: "5 OF 5"
- tapOn: "Find my meal"
- copyTextFrom:
    id: discovery-search
- assertTrue: ${maestro.copiedText === 'pizza'}
- assertVisible: ${String(output.targets.calories)}
- assertVisible: "50g"
- assertVisible: "44g"
- assertVisible: "14g"
- assertVisible:
    id: discovery-hero
- copyTextFrom:
    id: discovery-hero
- assertTrue: ${maestro.copiedText.includes(output.pizza.data[0].name) && maestro.copiedText.includes(output.pizza.data[0].bestMatch.name)}
- assertTrue: ${maestro.copiedText.includes('Pizza Roma') && maestro.copiedText.includes('Buffalo Chicken')}
- assertNotVisible:
    id: discovery-loading
# A genuinely absent craving still has an honest empty state and clear recovery.
- tapOn:
    id: discovery-clear-search
- tapOn:
    id: discovery-search
- inputText: "unfindablecravingxyz"
- pressKey: Enter
- extendedWaitUntil:
    visible: "No matches for this search"
    timeout: 30000
- assertVisible:
    id: discovery-empty-clear
- assertNotVisible:
    id: discovery-hero
- assertVisible: ${String(output.targets.calories)}
- assertVisible: "50g"
- assertVisible: "44g"
- assertVisible: "14g"
- tapOn:
    id: discovery-empty-clear
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- copyTextFrom:
    id: discovery-hero
- assertTrue: ${maestro.copiedText.includes(output.base.data[0].name) && maestro.copiedText.includes(output.base.data[0].bestMatch.name)}
- assertVisible: ${String(output.targets.calories)}
- assertVisible: "50g"
- assertVisible: "44g"
- assertVisible: "14g"
- assertNotVisible:
    id: discovery-clear-search
- assertNotVisible:
    id: discovery-empty-clear
