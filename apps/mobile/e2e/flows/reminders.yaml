# Native permission outcomes use the never-subscribed dev fixture, without purchases.
# Settings can request permission independently of store trial eligibility.
# Purchased reminder scheduling and delivery retain their separate native acceptance.
appId: com.fitsy.mobile
tags: [auth, notifications, changed-journey, 'fixture:unsubscribed-dev', 'store:test-store']
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: unset
# A cleared Debug client must reconnect to owned local Metro first.
# Retry startup reads only; authentication and permission actions stay single-pass.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "92%,93%"
- openLink: com.fitsy.mobile://notification-settings
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: reminder-permission
- assertVisible: "Device notifications are off"
- assertVisible:
    id: reminders-empty
- assertNotVisible:
    id: reminders-enable
- assertNotVisible:
    id: reminder-meals-toggle
- assertNotVisible:
    id: reminder-trial-toggle
- assertNotVisible: "Allow"
- openLink: com.fitsy.mobile://welcome/signin
- tapOn:
    text: "^Open$"
    optional: true
- tapOn:
    id: signup-dev
# Dev Login follows normal onboarding, which need not land on a paywall.
# Wait for successful sign-in before leaving its owned continuation.
- extendedWaitUntil:
    notVisible:
      id: signup-dev
    timeout: 30000
- openLink: com.fitsy.mobile://notification-settings
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: reminders-enable
    timeout: 15000
- assertVisible: "Reminders start with your active Fitsy subscription."
- assertVisible: "Device notifications are off"
- assertVisible:
    id: reminders-empty
- assertNotVisible: "Allow"
# Leaving without opting in must not consume the native permission prompt.
- tapOn:
    id: reminders-back
- openLink: com.fitsy.mobile://notification-settings
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: reminders-enable
    timeout: 15000
- assertVisible: "Device notifications are off"
- assertNotVisible: "Allow"
- tapOn:
    id: reminders-enable
- extendedWaitUntil:
    visible: "Don.t Allow"
    timeout: 15000
- assertVisible: "Allow"
- tapOn: "Don.t Allow"
- assertVisible: "Notifications are off"
- tapOn: "OK"
- assertVisible: "Device notifications are off"
- assertVisible:
    id: reminders-device-settings
- assertVisible:
    id: reminders-empty
- assertNotVisible:
    id: reminder-trial-toggle
- takeScreenshot: reminders-denied
# Reset permission and local preferences for the independent grant path.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: unset
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "92%,93%"
- openLink: com.fitsy.mobile://welcome/signin
- tapOn:
    text: "^Open$"
    optional: true
- tapOn:
    id: signup-dev
- extendedWaitUntil:
    notVisible:
      id: signup-dev
    timeout: 30000
- openLink: com.fitsy.mobile://notification-settings
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: reminders-enable
    timeout: 15000
- assertVisible: "Reminders start with your active Fitsy subscription."
- assertVisible: "Device notifications are off"
- assertNotVisible: "Allow"
- tapOn:
    id: reminders-enable
- extendedWaitUntil:
    visible: "Allow"
    timeout: 15000
- tapOn: "Allow"
- extendedWaitUntil:
    visible: "Device notifications allowed"
    timeout: 15000
# Permission and saved opt-in alone cannot schedule an inactive subscriber.
- assertVisible:
    id: reminders-empty
- assertNotVisible:
    id: reminders-enable
- assertNotVisible:
    id: reminder-meals-toggle
- assertNotVisible:
    id: reminder-trial-toggle
- takeScreenshot: reminders-granted
- stopApp
- launchApp
- openLink: com.fitsy.mobile://notification-settings
# Retry only the first hierarchy read through the relaunch transition.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - tapOn:
          text: "^Open$"
          optional: true
      - assertVisible: "Device notifications allowed"
- assertVisible:
    id: reminders-empty
- assertNotVisible:
    id: reminders-enable
- assertNotVisible:
    id: reminder-meals-toggle
- assertNotVisible:
    id: reminder-trial-toggle
- takeScreenshot: reminders-relaunched
