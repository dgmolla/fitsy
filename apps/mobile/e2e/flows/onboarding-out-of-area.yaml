# Simulator GPS only; coverage and recovery use the real dev API.
# Signup completion and waitlist database writes are checked in the native walkthrough.
appId: com.fitsy.mobile
tags: ['fixture:unsubscribed-dev', 'store:test-store', onboarding, auth, changed-journey]
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
# Retry only the startup read if XCTest catches an invalid transient AX frame.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- waitForAnimationToEnd
- tapOn:
    point: "92%,93%"
- setLocation:
    latitude: 40.7128
    longitude: -74.0060
- openLink: com.fitsy.mobile://welcome/location-permission
# A fresh simulator can require system confirmation for an app link.
- tapOn:
    text: "^Open$"
    optional: true
- runFlow:
    file: ../helpers/discovery-signin.yaml
    env:
      DESTINATION: "^location-(use-current|continue-area)$"
- extendedWaitUntil:
    visible:
      id: location-use-current
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: location-use-current
- extendedWaitUntil:
    visible:
      id: waitlist-join
    timeout: 30000
- assertVisible: "More menus are.*"
- assertNotVisible:
    id: paywall-plan-yearly
# Restart before opting in: neither authentication nor a coverage lookup joins the list.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: waitlist-join
    timeout: 30000
- assertNotVisible: "Continue with Apple"
- tapOn:
    id: waitlist-change-area
- extendedWaitUntil:
    visible:
      id: location-choose-area
      enabled: true
    timeout: 15000
- assertVisible: "Continue with Your location"
# Native navigation can expose the button before it accepts touches. Retry only
# an unchanged tap, then require the actual picker before selecting an area.
- waitForAnimationToEnd
- tapOn:
    id: location-choose-area
    retryTapIfNoChange: true
- assertVisible: "Choose a neighborhood"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Search near DTLA"
    direction: DOWN
- tapOn: "Search near DTLA"
- extendedWaitUntil:
    visible:
      id: goal-performance
    timeout: 30000
- assertVisible: "What's your goal.*"
- assertNotVisible:
    id: waitlist-join
- assertNotVisible:
    id: paywall-plan-yearly
# The selected manual area survives another restart, independent of GPS.
- stopApp
- launchApp
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: goal-performance
          timeout: 30000
- assertNotVisible:
    id: waitlist-join
- openLink: com.fitsy.mobile://welcome/location-permission
# A fresh simulator can require system confirmation for an app link.
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: location-continue-area
    timeout: 15000
- assertVisible: "Continue with DTLA"
- assertNotVisible: "Continue with Your location"
- tapOn:
    id: location-continue-area
- extendedWaitUntil:
    visible:
      id: goal-performance
    timeout: 30000
- assertNotVisible:
    id: waitlist-join
