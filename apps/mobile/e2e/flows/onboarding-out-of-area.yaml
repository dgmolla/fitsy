# Simulator GPS only; coverage and recovery use the real dev API.
# Signup completion and waitlist database writes are checked in the native walkthrough.
appId: com.fitsy.mobile
tags: [onboarding, auth, changed-journey]
---
- launchApp:
    clearState: true
    clearKeychain: true
# Retry only the startup read if XCTest catches an invalid transient AX frame.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- waitForAnimationToEnd
- tapOn:
    point: "92%,93%"
- setLocation:
    latitude: 40.7128
    longitude: -74.0060
- openLink: com.fitsy.mobile://welcome/location-permission
- extendedWaitUntil:
    visible:
      id: location-use-current
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: location-use-current
- extendedWaitUntil:
    visible:
      id: waitlist-join
    timeout: 30000
- assertVisible: "More menus are.*"
- assertNotVisible:
    id: paywall-plan-yearly
- tapOn:
    id: waitlist-join
- assertVisible: "Continue with Apple"
- assertVisible: "Continue with Google"
# Interrupting waitlist signup must keep its destination across a cold launch.
- stopApp
- launchApp
# XCTest can reject a transient startup frame. Retry the read, not navigation.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: waitlist-join
          timeout: 30000
# A cold Debug launch recreates the native LogBox window above the footer.
# Dismiss its close control in the blank right margin before product taps.
- tapOn:
    point: "92%,93%"
- assertVisible: "More menus are.*"
- assertNotVisible: "Continue with Apple"
- tapOn:
    id: waitlist-join
- assertVisible: "Continue with Apple"
- assertVisible: "Continue with Google"
- tapOn:
    id: welcome-back
- assertVisible:
    id: waitlist-change-area
- tapOn:
    id: waitlist-change-area
- extendedWaitUntil:
    visible:
      id: location-choose-area
    timeout: 15000
- assertVisible: "Continue with Your location"
# Wait for the returning screen to finish its navigation animation before tapping.
- waitForAnimationToEnd
- tapOn:
    id: location-choose-area
- assertVisible: "Choose a neighborhood"
- waitForAnimationToEnd
- tapOn: "Search near DTLA"
- extendedWaitUntil:
    visible:
      id: tried-meal_prep
    timeout: 30000
- assertVisible: "What have you tried.*for healthy eating.*"
- assertNotVisible:
    id: waitlist-join
- assertNotVisible:
    id: paywall-plan-yearly
# The selected manual area survives another restart, independent of GPS.
- stopApp
- launchApp
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: tried-meal_prep
          timeout: 30000
- assertNotVisible:
    id: waitlist-join
- openLink: com.fitsy.mobile://welcome/location-permission
- extendedWaitUntil:
    visible:
      id: location-continue-area
    timeout: 15000
- assertVisible: "Continue with DTLA"
- assertNotVisible: "Continue with Your location"
- tapOn:
    id: location-continue-area
- extendedWaitUntil:
    visible:
      id: tried-meal_prep
    timeout: 30000
- assertNotVisible:
    id: waitlist-join
