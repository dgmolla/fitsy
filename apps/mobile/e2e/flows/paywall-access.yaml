# Standard dev seed, read-only menu; no purchase or synthetic entitlement.
appId: com.fitsy.mobile
tags: [billing, discovery, onboarding, changed-journey]
---
- evalScript: ${output.search = http.get('https://dev.fitsy.org/api/restaurants?lat=34.0522&lng=-118.2437&radius=5&q=Seed%20Bowl%20Co')}
- assertTrue: ${output.search.status === 200}
- evalScript: >-
    ${output.seed = json(output.search.body).data.filter(function (r) { return r.name === 'Seed Bowl Co #01'; })[0]}
- assertTrue: ${!!output.seed}
- launchApp:
    clearState: true
    clearKeychain: true # Disposable simulator: earlier billing flows sign in.
# XCTest may reject the first accessibility snapshot after a clean reinstall.
# Retry startup only; keep the access-control interactions single-pass.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible: "Find meals that fit"
- waitForAnimationToEnd:
    timeout: 3000
# Dismiss the Debug-only warning window outside the welcome controls.
- tapOn:
    point: "92%,93%"
- openLink: ${'com.fitsy.mobile://restaurant/' + output.seed.id}
# A fresh simulator can require system confirmation for an app link.
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Seed Bowl Co #01"
    timeout: 20000
- tapOn:
    text: Got it
    optional: true
- tapOn:
    id: restaurant-back
- assertVisible: "Find meals that fit"
- assertNotVisible: "Continue with Apple"
- openLink: ${'com.fitsy.mobile://restaurant/' + output.seed.id}
# A fresh simulator can require system confirmation for an app link.
- tapOn:
    text: "^Open$"
    optional: true
- scrollUntilVisible:
    element:
      id: locked-value-cta
    direction: DOWN
- assertVisible: "Find meals that fit.*"
- tapOn:
    id: locked-value-cta
- assertVisible: "Continue with Apple"
- assertVisible: "Continue with Google"
# Direct no-trial entry must authenticate before any plan or checkout control.
- openLink: com.fitsy.mobile://welcome/payment
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- assertVisible: "Continue with Google"
- assertNotVisible:
    id: paywall-plan-yearly
- assertNotVisible:
    id: paywall-price-yearly
# A stale win-back link has the same pre-auth guard, and Back must not loop.
- openLink: com.fitsy.mobile://welcome/resubscribe
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- assertNotVisible:
    id: resubscribe-restore
- tapOn:
    id: welcome-back
- extendedWaitUntil:
    visible: "Find meals that fit"
    timeout: 15000
# The post-decline preview and cold-resume route are exercised after an
# observed paywall decline in onboarding-returning-preview.yaml.
# A notification deep link cannot complete onboarding without entitlement.
- openLink: com.fitsy.mobile://welcome/notification-permission
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- assertNotVisible:
    id: notification-skip
- assertNotVisible:
    id: paywall-logo
