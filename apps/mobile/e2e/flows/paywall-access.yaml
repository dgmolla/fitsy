# Standard dev seed, read-only menu; no purchase or synthetic entitlement.
appId: com.fitsy.mobile
tags: ['fixture:unsubscribed-dev', 'store:test-store', billing, discovery, onboarding, changed-journey]
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- evalScript: ${output.apiPaths = ['https://dev.fitsy.org/api/restaurants?lat=34.0522&lng=-118.2437&radius=5&q=Seed%20Bowl%20Co']}
- runScript: ../helpers/data-api.mjs
- assertTrue: ${output.dataApiLoginStatus === 200 && output.dataApiUnauthStatus === 401 && output.dataApiInvalidStatus === 401}
- evalScript: ${output.search = output.dataApiResponses[0]}
- assertTrue: ${output.search.status === 200}
- evalScript: >-
    ${output.seed = json(output.search.body).data.filter(function (r) { return r.name === 'Seed Bowl Co #01'; })[0]}
- assertTrue: ${!!output.seed}
- launchApp:
    clearState: true
    clearKeychain: true # Disposable simulator: earlier billing flows sign in.
# XCTest may reject the first accessibility snapshot after a clean reinstall.
# Retry startup only; keep the access-control interactions single-pass.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
# Dismiss the Debug-only warning window outside the welcome controls.
- tapOn:
    point: "92%,93%"
# A restaurant deep link cannot expose even its sample before sign-in.
- openLink: ${'com.fitsy.mobile://restaurant/' + output.seed.id}
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: signup-apple
    timeout: 30000
- assertNotVisible:
    id: menu-search
- assertNotVisible:
    id: paywall-plan-yearly
- tapOn:
    id: welcome-back
- extendedWaitUntil:
    visible:
      id: welcome-start
    timeout: 15000
# Direct checkout and win-back links also keep plans behind sign-in.
- openLink: com.fitsy.mobile://welcome/payment
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: signup-apple
    timeout: 15000
- assertNotVisible:
    id: paywall-price-yearly
- tapOn:
    id: welcome-back
- openLink: com.fitsy.mobile://welcome/resubscribe
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: signup-google
    timeout: 15000
- assertNotVisible:
    id: resubscribe-restore
- tapOn:
    id: welcome-back
- extendedWaitUntil:
    visible:
      id: welcome-start
    timeout: 15000
# A real free account can inspect its bounded sample; a plan is still required.
- openLink: ${'com.fitsy.mobile://restaurant/' + output.seed.id}
- tapOn:
    text: "^Open$"
    optional: true
- runFlow:
    file: ../helpers/discovery-signin.yaml
    env:
      DESTINATION: menu-search
- assertVisible: "Seed Bowl Co #01"
- scrollUntilVisible:
    element:
      id: locked-value-cta
    direction: DOWN
- tapOn:
    id: locked-value-cta
- extendedWaitUntil:
    visible:
      id: paywall-logo
    timeout: 30000
- assertVisible:
    id: paywall-plan-yearly
- assertNotVisible:
    id: signup-apple
