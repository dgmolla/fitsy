# Uses the standard dev data from prisma/seed.ts --data-only.
# These are synthetic seed expectations, not a nutrition-accuracy reference.
# Pipeline writer replays and source review remain separate data checks.
appId: com.fitsy.mobile
tags:
  - billing
  - discovery
  - changed-journey
---
- evalScript: ${output.search = http.get('https://dev.fitsy.org/api/restaurants?lat=34.0522&lng=-118.2437&radius=5&q=Seed%20Bowl%20Co')}
- assertTrue: ${output.search.status === 200}
- evalScript: >-
    ${output.seed = json(output.search.body).data.filter(function (r) { return r.name === 'Seed Bowl Co #01'; })[0]}
- assertTrue: ${!!output.seed}
- evalScript: ${output.response = http.get('https://dev.fitsy.org/api/restaurants/' + output.seed.id + '/menu')}
- assertTrue: ${output.response.status === 200}
- evalScript: ${output.menu = json(output.response.body).data}
- assertTrue: ${output.menu.totalItemCount === 8 && output.menu.locked && output.menu.menuItems.length === 3}
- evalScript: ${output.chicken = output.menu.menuItems.filter(function (i) { return i.name === 'Grilled Chicken Bowl'; })[0]}
- assertTrue: ${!!output.chicken && output.chicken.macros.calories === 520 && output.chicken.macros.proteinG === 42 && output.chicken.macros.carbsG === 48 && output.chicken.macros.fatG === 14 && output.chicken.macros.confidence === 'HIGH'}
- launchApp:
    clearState: true
    clearKeychain: true
# clearState also clears a dev client's selected server. Open owned local
# Metro when its launcher is present; embedded builds skip this branch.
# Retry startup only, never the menu or authentication assertions.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- openLink: ${'com.fitsy.mobile://restaurant/' + output.seed.id}
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Seed Bowl Co #01"
    timeout: 20000
- tapOn:
    text: Got it
    optional: true
- assertVisible: "8 items"
- assertVisible: ".*dish name hidden, view plans to find this meal.*"
- tapOn: "Search the menu.*"
- inputText: fitsy-no-such-dish
- assertVisible: "No dishes match these filters."
- tapOn: "Clear search"
- assertNotVisible: "No dishes match these filters."
- assertVisible: ".*dish name hidden, view plans to find this meal.*"
- tapOn: "Search the menu.*"
- inputText: Grilled Chicken Bowl
- assertVisible: "1 dish matches"
- tapOn: "Clear search"
- assertVisible: "3 dishes match"
- tapOn:
    id: ${"menu-item-" + output.chicken.id}
# A locked meal keeps its restaurant selection through the sign-in gate.
- extendedWaitUntil:
    visible:
      id: signup-selected-restaurant-name
    timeout: 15000
- assertVisible:
    id: signup-selected-restaurant-name
    text: "Seed Bowl Co #01"
- assertVisible:
    id: signup-apple
- assertVisible:
    id: signup-google
- assertNotVisible:
    id: paywall-plan-yearly
- assertNotVisible:
    id: paywall-price-yearly
