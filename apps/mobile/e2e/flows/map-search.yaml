# Real iOS Apple Maps with the existing subscriber API; no PostHog changes or purchases.
appId: com.fitsy.mobile
tags: [billing, discovery, changed-journey, 'fixture:entitled-dev', 'store:test-store']
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- runFlow:
    file: ../helpers/map-search-setup.yaml
    env:
      LOCATION_PERMISSION: inuse
- tapOn:
    id: discovery-location
- extendedWaitUntil:
    visible: "Choose a neighborhood"
    timeout: 5000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Search near DTLA"
    direction: DOWN
    centerElement: true
- tapOn: "Search near DTLA"
- extendedWaitUntil:
    visible: "Location: DTLA"
    timeout: 15000
- tapOn:
    id: preview-edit-targets
- runFlow:
    when:
      visible:
        id: meal-filter-unlink
    commands:
      - tapOn:
          id: meal-filter-unlink
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "40"
- tapOn: "Carbs grams"
- eraseText: 7
- inputText: "60"
- tapOn: "Fat grams"
- eraseText: 7
- inputText: "20"
- tapOn: "Calories per meal"
- eraseText: 7
- inputText: "600"
- tapOn:
    id: meal-filter-apply
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- assertNotVisible:
    id: map-preview
- tapOn:
    id: map-pin-0
- assertVisible:
    id: map-preview-open
- assertVisible:
    id: map-carousel
- takeScreenshot: map-search-preview
- takeScreenshot: map-poc-c
- tapOn:
    id: map-preview-open
- extendedWaitUntil:
    visible:
      id: menu-search
    timeout: 30000
- tapOn:
    id: restaurant-back
- extendedWaitUntil:
    visible:
      id: discovery-map
    timeout: 15000
- tapOn:
    id: discovery-search
- inputText: pizza
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-preview-open
- evalScript: ${output.mapBeforeToggle = maestro.copiedText}
- tapOn:
    id: discovery-view-toggle
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-hero
- assertVisible:
    id: discovery-search
    text: pizza
- tapOn:
    id: discovery-view-toggle
- assertVisible:
    id: discovery-map
- assertVisible:
    id: discovery-search
    text: pizza
- assertVisible:
    id: map-filter-protein
    text: "Edit protein grams, 40"
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-preview-open
- assertTrue: ${maestro.copiedText === output.mapBeforeToggle}
# Edit the same filters after toggling and retain the craving.
- tapOn:
    id: preview-edit-targets
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "45"
- tapOn:
    id: meal-filter-apply
- assertVisible:
    id: map-filter-protein
    text: "Edit protein grams, 45"
- assertVisible:
    id: discovery-search
    text: pizza
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
# Ranked pizza rows need not satisfy Shuffle's close-fit nutrition filter.
# Clear the craving and restore the exact targets verified by the subscriber
# preflight before requiring a nonempty, changed shuffle page.
- tapOn:
    id: discovery-clear-search
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- assertVisible:
    id: discovery-search
- assertNotVisible:
    id: discovery-search
    text: pizza
- tapOn:
    id: preview-edit-targets
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "40"
- tapOn:
    id: meal-filter-apply
- assertVisible:
    id: map-filter-protein
    text: "Edit protein grams, 40"
- extendedWaitUntil:
    visible:
      id: shuffle-button
      enabled: true
    timeout: 30000
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-preview-open
- evalScript: ${output.mapBeforeShuffle = maestro.copiedText}
- tapOn:
    id: shuffle-button
- extendedWaitUntil:
    visible:
      id: shuffle-button
      enabled: true
    timeout: 30000
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-preview-open
- assertTrue: ${maestro.copiedText !== output.mapBeforeShuffle}
- assertVisible:
    id: discovery-search
- assertNotVisible:
    id: discovery-search
    text: pizza
- assertVisible:
    id: map-filter-protein
    text: "Edit protein grams, 40"
- assertVisible: "Location: DTLA"
- takeScreenshot: map-search-shuffle

# Swipe the real carousel from the deterministic first card before comparing layouts.
- runFlow: ../helpers/map-first-spot.yaml
- swipe:
    start: "83%,70%"
    end: "10%,70%"
    duration: 450
- waitForAnimationToEnd
- assertVisible:
    id: map-page
    text: "^2 / [1-9][0-9]*$"
- assertVisible:
    id: map-preview-open
- takeScreenshot: map-poc-c-swiped
# Compare the dev-only layouts with the same bounded results and search state.
- tapOn:
    id: map-variant-A
- assertVisible:
    id: map-list-A
- assertVisible:
    id: discovery-hero
- takeScreenshot: map-poc-a
- tapOn:
    id: map-variant-B
- assertVisible:
    id: map-list-B
- assertVisible:
    id: map-sheet-half
- takeScreenshot: map-poc-b-half
- tapOn:
    id: map-sheet-height
- assertVisible:
    id: map-sheet-full
- takeScreenshot: map-poc-b-full
# A clamped programmatic scroll must retain the final explicit restaurant target.
- copyTextFrom:
    id: map-page
- evalScript: ${output.mapCount = Number(maestro.copiedText.match(/[0-9]+/)[0])}
- repeat:
    times: ${output.mapCount}
    commands:
      - tapOn:
          id: map-next-spot
      - waitForAnimationToEnd
- copyTextFrom:
    id: map-page
- assertTrue: ${Number(maestro.copiedText.split(' / ')[0]) === output.mapCount && Number(maestro.copiedText.split(' / ')[1]) === output.mapCount}
- takeScreenshot: map-poc-b-last
# Real list drags still synchronize the selected restaurant with the map.
- swipe:
    start: "50%,65%"
    end: "50%,78%"
    duration: 450
- waitForAnimationToEnd
- copyTextFrom:
    id: map-page
- assertTrue: ${Number(maestro.copiedText.split(' / ')[0]) > 0 && Number(maestro.copiedText.split(' / ')[0]) < output.mapCount && Number(maestro.copiedText.split(' / ')[1]) === output.mapCount}
- tapOn:
    id: map-sheet-height
- assertVisible:
    id: map-sheet-peek
- assertVisible:
    id: map-sheet-peek-card
- takeScreenshot: map-poc-b-peek
- tapOn:
    id: map-variant-C
- assertVisible:
    id: map-carousel
- assertVisible: "Location: DTLA"
- assertVisible:
    id: map-filter-protein
    text: "Edit protein grams, 40"
