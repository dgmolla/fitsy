# Owner6713988813 retired A/B and baseline C; only chosen C alternate remains active.
# Keep real subscriber search, current navigation and Test Store acceptance.
appId: com.fitsy.mobile
tags: [billing, discovery, changed-journey, 'fixture:entitled-dev', 'store:test-store']
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- runFlow:
    file: ../helpers/map-search-setup.yaml
    env:
      LOCATION_PERMISSION: inuse
- tapOn:
    id: discovery-location
- extendedWaitUntil:
    visible: "Choose a neighborhood"
    timeout: 5000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Search near DTLA"
    direction: DOWN
    centerElement: true
- tapOn: "Search near DTLA"
- assertVisible: "Location: DTLA"
- assertVisible:
    id: map-carousel
- assertVisible:
    id: map-goals
- assertNotVisible:
    id: map-sheet-height
- assertNotVisible:
    id: map-list-A
- assertNotVisible:
    id: discovery-macro-strip
- assertNotVisible:
    id: preview-edit-targets
- assertNotVisible: "^Nearby$"
- assertNotVisible:
    id: map-options-open
# Search replaces the map with the ordinary list and its macro editor.
- tapOn:
    id: map-search-entry
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-goals
- tapOn:
    id: discovery-goals
- runFlow:
    when:
      visible:
        id: meal-filter-unlink
    commands:
      - tapOn:
          id: meal-filter-unlink
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "40"
- tapOn: "Carbs grams"
- eraseText: 7
- inputText: "60"
- tapOn: "Fat grams"
- eraseText: 7
- inputText: "20"
- tapOn: "Calories per meal"
- eraseText: 7
- inputText: "600"
- tapOn:
    id: meal-filter-apply
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- takeScreenshot: map-v2-search-list-macros
- tapOn:
    id: discovery-view-toggle
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible:
    id: map-preview-open
- tapOn:
    id: map-pin-0
- assertVisible:
    id: map-preview-open
- assertVisible:
    id: map-carousel
- assertVisible:
    id: floating-tab-bar
- takeScreenshot: map-v2-c-utensils
- tapOn:
    id: map-preview-open
- extendedWaitUntil:
    visible:
      id: menu-search
    timeout: 30000
- tapOn:
    id: restaurant-back
- extendedWaitUntil:
    visible:
      id: discovery-map
    timeout: 15000
- tapOn:
    id: map-search-entry
- tapOn:
    id: discovery-search
- inputText: pizza
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-macro-strip
- assertVisible:
    id: discovery-search
    text: pizza
- assertVisible:
    id: shuffle-button
- tapOn:
    id: discovery-view-toggle
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: map-pin-0
- assertVisible:
    id: map-preview-open
- assertVisible:
    id: shuffle-button
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-card-0
- evalScript: ${output.mapBeforeToggle = maestro.copiedText}
- tapOn:
    id: map-search-entry
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-search
    text: pizza
- assertVisible:
    id: discovery-macro-strip
- tapOn:
    id: discovery-view-toggle
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-card-0
- assertTrue: ${maestro.copiedText === output.mapBeforeToggle}
# The chosen C alternate edits the same macros while staying on the map.
- assertVisible:
    id: map-goals
- assertVisible:
    id: map-goals
    text: Edit macros
- tapOn:
    id: map-goals
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "45"
- tapOn:
    id: meal-filter-apply
- assertVisible:
    id: discovery-map
- assertVisible:
    id: map-search-entry
    text: "Search: pizza"
- tapOn:
    id: map-goals
- assertVisible:
    text: "45"
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "40"
- tapOn: "Calories per meal"
- eraseText: 7
- inputText: "600"
- tapOn:
    id: meal-filter-apply
# Restore the exact bounded subscriber context before positive shuffle proof.
- tapOn:
    id: map-search-entry
- tapOn:
    id: discovery-clear-search
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- tapOn:
    id: discovery-view-toggle
- extendedWaitUntil:
    visible:
      id: shuffle-button
      enabled: true
    timeout: 30000
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-card-0
- evalScript: ${output.mapBeforeShuffle = maestro.copiedText}
- tapOn:
    id: shuffle-button
- extendedWaitUntil:
    visible:
      id: shuffle-button
      enabled: true
    timeout: 30000
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-card-0
- assertTrue: ${maestro.copiedText !== output.mapBeforeShuffle}
- assertVisible: "Location: DTLA"
- tapOn:
    id: map-goals
- assertVisible:
    text: "40"
- runFlow: ../helpers/dismiss-meal-targets.yaml
- takeScreenshot: map-chosen-c-macros-shuffle
# The owner-selected list has one Map control; area editing stays on the map.
- tapOn:
    id: map-search-entry
- assertVisible:
    id: discovery-list
- assertNotVisible:
    id: discovery-location
- assertVisible:
    id: discovery-macro-strip
- takeScreenshot: map-list-single
- tapOn:
    id: discovery-view-toggle
- assertVisible:
    id: discovery-location
- tapOn:
    id: discovery-location
- waitForAnimationToEnd
- tapOn: "Search near Hollywood"
- assertVisible: "Location: Hollywood"
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
# Dragging only offers an action; the existing bounded search runs on confirmation.
- swipe:
    start: "60%,44%"
    end: "35%,44%"
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    id: map-search-area
- assertVisible: "Location: Hollywood"
- takeScreenshot: map-area-pending
- tapOn:
    id: map-search-area
- extendedWaitUntil:
    visible: "Location: Map area"
    timeout: 10000
- assertNotVisible:
    id: map-search-area
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: map-pin-0
- assertVisible:
    id: map-preview-open
- takeScreenshot: map-area-results
- tapOn:
    id: discovery-location
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Search near DTLA"
    direction: DOWN
    centerElement: true
- tapOn: "Search near DTLA"
- assertVisible: "Location: DTLA"
- takeScreenshot: map-v2-icon-pins
- swipe:
    start: "83%,70%"
    end: "10%,70%"
    duration: 450
- waitForAnimationToEnd
- assertVisible:
    id: map-page
    text: "^2 / [1-9][0-9]*$"
- assertVisible:
    id: map-preview-open
- takeScreenshot: map-v2-carousel-swiped
# Keep the final visible C restaurant, matching pin name and counter synchronized.
- copyTextFrom:
    id: map-page
- evalScript: ${output.mapCount = Number(maestro.copiedText.split(' / ').pop().split(' ')[0])}
- repeat:
    times: ${Math.max(0, output.mapCount - 2)}
    commands:
      - swipe:
          start: "83%,70%"
          end: "10%,70%"
          duration: 450
      - waitForAnimationToEnd
- copyTextFrom:
    id: map-page
- assertTrue: ${Number(maestro.copiedText.split(' / ')[0]) === output.mapCount && Number(maestro.copiedText.split(' / ')[1]) === output.mapCount}
- copyTextFrom:
    id: map-preview-open
- assertTrue: ${maestro.copiedText.indexOf('Open ') === 0 && maestro.copiedText.indexOf(' · ') > 5}
- evalScript: ${output.mapLastName = maestro.copiedText.substring(5, maestro.copiedText.indexOf(' · '))}
- copyTextFrom:
    id: ${'map-pin-' + (output.mapCount - 1)}
- assertTrue: ${maestro.copiedText.indexOf(output.mapLastName) === 0}
- takeScreenshot: map-chosen-c-final-card
- swipe:
    start: "10%,70%"
    end: "83%,70%"
    duration: 450
- waitForAnimationToEnd
- copyTextFrom:
    id: map-page
- assertTrue: ${Number(maestro.copiedText.split(' / ')[0]) === output.mapCount - 1}
- assertVisible:
    id: map-preview-open
- takeScreenshot: map-chosen-c-user-scroll
- assertVisible: "Location: DTLA"
- assertVisible:
    id: floating-tab-bar
# Chosen C's empty response must fit real recovery actions above navigation.
- tapOn:
    id: map-search-entry
- tapOn:
    id: discovery-search
- inputText: zzznomatch753zzz
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: discovery-empty-clear
    timeout: 30000
- tapOn:
    id: discovery-view-toggle
- assertNotVisible:
    id: map-sheet-height
- takeScreenshot: map-chosen-c-empty
- tapOn:
    id: discovery-empty-edit
- extendedWaitUntil:
    visible:
      id: meal-filter-apply
    timeout: 15000
- tapOn:
    id: meal-filter-apply
- extendedWaitUntil:
    visible:
      id: discovery-empty-clear
    timeout: 15000
- tapOn:
    id: discovery-empty-clear
- extendedWaitUntil:
    visible:
      id: map-carousel
    timeout: 30000
- assertVisible:
    id: map-pin-0
- takeScreenshot: map-chosen-c-empty-recovered
