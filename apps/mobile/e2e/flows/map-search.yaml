# Dev-only map studies use real subscriber search, current navigation and Test Store.
appId: com.fitsy.mobile
tags: [billing, discovery, changed-journey, 'fixture:entitled-dev', 'store:test-store']
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- runFlow:
    file: ../helpers/map-search-setup.yaml
    env:
      LOCATION_PERMISSION: inuse
- tapOn:
    id: discovery-location
- extendedWaitUntil:
    visible: "Choose a neighborhood"
    timeout: 5000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Search near DTLA"
    direction: DOWN
    centerElement: true
- tapOn: "Search near DTLA"
- assertVisible: "Location: DTLA"
- assertNotVisible:
    id: discovery-macro-strip
- assertNotVisible:
    id: preview-edit-targets
- assertNotVisible: "^Nearby$"
# Search replaces the map with the ordinary list and its macro editor.
- tapOn:
    id: map-search-entry
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-macro-strip
- tapOn:
    id: preview-edit-targets
- runFlow:
    when:
      visible:
        id: meal-filter-unlink
    commands:
      - tapOn:
          id: meal-filter-unlink
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "40"
- tapOn: "Carbs grams"
- eraseText: 7
- inputText: "60"
- tapOn: "Fat grams"
- eraseText: 7
- inputText: "20"
- tapOn: "Calories per meal"
- eraseText: 7
- inputText: "600"
- tapOn:
    id: meal-filter-apply
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- takeScreenshot: map-v2-search-list-macros
- tapOn:
    id: discovery-view-toggle
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible:
    id: map-preview-open
- tapOn:
    id: map-pin-0
- assertVisible:
    id: map-preview-open
- assertVisible:
    id: map-carousel
- assertVisible:
    id: floating-tab-bar
- takeScreenshot: map-v2-c-utensils
- tapOn:
    id: map-preview-open
- extendedWaitUntil:
    visible:
      id: menu-search
    timeout: 30000
- tapOn:
    id: restaurant-back
- extendedWaitUntil:
    visible:
      id: discovery-map
    timeout: 15000
- tapOn:
    id: map-search-entry
- tapOn:
    id: discovery-search
- inputText: pizza
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-macro-strip
- assertVisible:
    id: discovery-search
    text: pizza
- tapOn:
    id: discovery-view-toggle
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: map-pin-0
- assertVisible:
    id: map-preview-open
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-card-0
- evalScript: ${output.mapBeforeToggle = maestro.copiedText}
- tapOn:
    id: map-search-entry
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-search
    text: pizza
- assertVisible:
    id: discovery-macro-strip
- tapOn:
    id: discovery-view-toggle
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-card-0
- assertTrue: ${maestro.copiedText === output.mapBeforeToggle}
# The chosen C alternate edits the same macros while staying on the map.
- tapOn:
    id: map-options-open
- tapOn:
    id: map-variant-G
- assertVisible:
    id: map-goals
- assertVisible: Macros
- tapOn:
    id: map-goals
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "45"
- tapOn:
    id: meal-filter-apply
- assertVisible:
    id: discovery-map
- assertVisible:
    id: map-search-entry
    text: "Search: pizza"
- tapOn:
    id: map-goals
- assertVisible:
    text: "45"
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "40"
- tapOn: "Calories per meal"
- eraseText: 7
- inputText: "600"
- tapOn:
    id: meal-filter-apply
# Restore the exact bounded subscriber context before positive shuffle proof.
- tapOn:
    id: map-search-entry
- tapOn:
    id: discovery-clear-search
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- tapOn:
    id: discovery-view-toggle
- extendedWaitUntil:
    visible:
      id: shuffle-button
      enabled: true
    timeout: 30000
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-card-0
- evalScript: ${output.mapBeforeShuffle = maestro.copiedText}
- tapOn:
    id: shuffle-button
- extendedWaitUntil:
    visible:
      id: shuffle-button
      enabled: true
    timeout: 30000
- runFlow: ../helpers/map-first-spot.yaml
- copyTextFrom:
    id: map-card-0
- assertTrue: ${maestro.copiedText !== output.mapBeforeShuffle}
- assertVisible: "Location: DTLA"
- tapOn:
    id: map-goals
- assertVisible:
    text: "40"
- runFlow: ../helpers/dismiss-meal-targets.yaml
- takeScreenshot: map-v2-g-goals
# Both list studies integrate Map into the location control and keep the real picker.
- tapOn:
    id: map-options-open
- tapOn:
    id: map-list-style-split
- assertVisible:
    id: list-location-split
- assertVisible:
    id: discovery-macro-strip
- tapOn:
    id: discovery-location
- waitForAnimationToEnd
- tapOn: "Search near Hollywood"
- assertVisible: "Location: Hollywood"
- tapOn:
    id: discovery-location
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Search near DTLA"
    direction: DOWN
    centerElement: true
- tapOn: "Search near DTLA"
- assertVisible: "Location: DTLA"
- takeScreenshot: map-list-split
- tapOn:
    id: discovery-view-toggle
- tapOn:
    id: map-options-open
- tapOn:
    id: map-list-style-compact
- assertVisible:
    id: list-location-compact
- assertVisible:
    id: discovery-macro-strip
- tapOn:
    id: discovery-location
- waitForAnimationToEnd
- tapOn: "Search near Hollywood"
- assertVisible: "Location: Hollywood"
- tapOn:
    id: discovery-location
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Search near DTLA"
    direction: DOWN
    centerElement: true
- tapOn: "Search near DTLA"
- assertVisible: "Location: DTLA"
- takeScreenshot: map-list-compact
- tapOn:
    id: discovery-view-toggle
- tapOn:
    id: map-options-open
- tapOn:
    id: map-pin-style-cuisine
- takeScreenshot: map-v2-cuisine-pins
- tapOn:
    id: map-options-open
- tapOn:
    id: map-pin-style-icon
- takeScreenshot: map-v2-icon-pins
- tapOn:
    id: map-options-open
- tapOn:
    id: map-pin-style-numbered
- takeScreenshot: map-v2-numbered-pins
- swipe:
    start: "83%,70%"
    end: "10%,70%"
    duration: 450
- waitForAnimationToEnd
- assertVisible:
    id: map-page
    text: "^2 / [1-9][0-9]*$"
- assertVisible:
    id: map-preview-open
- takeScreenshot: map-v2-carousel-swiped
- tapOn:
    id: map-options-open
- tapOn:
    id: map-variant-A
- assertVisible:
    id: map-list-A
- assertVisible:
    id: discovery-hero
- takeScreenshot: map-v2-a-map-list
- tapOn:
    id: map-options-open
- tapOn:
    id: map-variant-B
- assertVisible:
    id: map-sheet-peek
- assertVisible:
    id: map-sheet-peek-card
- takeScreenshot: map-v2-b-peek
- tapOn:
    id: map-sheet-height
- assertVisible:
    id: map-sheet-half
- assertVisible:
    id: map-list-B
- takeScreenshot: map-v2-b-half
- tapOn:
    id: map-sheet-height
- assertVisible:
    id: map-sheet-full
- assertVisible:
    id: discovery-macro-strip
- takeScreenshot: map-v2-b-full-macros
# Final-row selection must agree with the actual row, including across detents.
- copyTextFrom:
    id: map-page
- evalScript: ${output.mapCount = Number(maestro.copiedText.split(' / ').pop().split(' ')[0])}
- repeat:
    times: ${output.mapCount}
    commands:
      - tapOn:
          id: map-next-spot
      - waitForAnimationToEnd
- copyTextFrom:
    id: map-page
- assertTrue: ${Number(maestro.copiedText.split(' / ')[0]) === output.mapCount && Number(maestro.copiedText.split(' / ')[1]) === output.mapCount}
- assertVisible:
    id: ${'preview-pick-' + output.mapCount}
- copyTextFrom:
    id: ${'preview-pick-' + output.mapCount}
- assertTrue: ${maestro.copiedText.lastIndexOf(', view full menu') > 0}
- evalScript: ${output.mapLastName = maestro.copiedText.substring(0, maestro.copiedText.lastIndexOf(', view full menu'))}
- takeScreenshot: map-v2-b-full-last
- tapOn:
    id: map-sheet-height
- assertVisible:
    id: map-sheet-peek
- copyTextFrom:
    id: map-sheet-peek-card
- assertTrue: ${maestro.copiedText.indexOf(output.mapLastName) >= 0}
- takeScreenshot: map-v2-b-peek-last
- tapOn:
    id: map-sheet-height
- assertVisible:
    id: map-sheet-half
- copyTextFrom:
    id: map-page
- assertTrue: ${Number(maestro.copiedText.split(' / ')[0]) === output.mapCount}
- assertVisible:
    id: ${'preview-pick-' + output.mapCount}
- assertNotVisible:
    id: preview-pick-1
- takeScreenshot: map-v2-b-half-last
# Real user scrolling still owns selection after a programmatic final-row jump.
- swipe:
    start: "50%,65%"
    end: "50%,78%"
    duration: 450
- waitForAnimationToEnd
- copyTextFrom:
    id: map-page
- evalScript: ${output.mapVisibleIndex = Number(maestro.copiedText.split(' / ')[0])}
- assertTrue: ${output.mapVisibleIndex > 0 && output.mapVisibleIndex < output.mapCount}
- assertVisible:
    id: ${'preview-pick-' + output.mapVisibleIndex}
- takeScreenshot: map-v2-b-user-scroll
- assertVisible: "Location: DTLA"
- assertVisible:
    id: floating-tab-bar
# B's empty response must fit real recovery actions above the navigation.
- tapOn:
    id: map-search-entry
- tapOn:
    id: discovery-search
- inputText: zzznomatch753zzz
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: discovery-empty-clear
    timeout: 30000
- tapOn:
    id: discovery-view-toggle
- assertVisible:
    id: map-sheet-peek
- takeScreenshot: map-v2-b-empty
- tapOn:
    id: discovery-empty-edit
- extendedWaitUntil:
    visible:
      id: meal-filter-apply
    timeout: 15000
- tapOn:
    id: meal-filter-apply
- extendedWaitUntil:
    visible:
      id: discovery-empty-clear
    timeout: 15000
- tapOn:
    id: discovery-empty-clear
- extendedWaitUntil:
    visible:
      id: map-sheet-peek-card
    timeout: 30000
- assertVisible:
    id: map-pin-0
- takeScreenshot: map-v2-b-empty-recovered
