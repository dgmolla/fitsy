# Populated dev backend plus an entitled account on a Debug build.
# Debug-only shuffleDebug opts in locally without changing PostHog flags.
# Shuffle fetches a fresh search page, retaining targets, area and access rules.
appId: com.fitsy.mobile
tags: [billing, discovery, changed-journey, 'fixture:entitled-dev', 'store:test-store']
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- assertTrue: ${!!LOGIN_EMAIL && !!LOGIN_PASSWORD}
- evalScript: ${output.apiPaths = ['https://dev.fitsy.org/api/restaurants?lat=34.0407&lng=-118.2468']}
- runScript: ../helpers/data-api.mjs
- assertTrue:
    condition: ${output.dataApiLoginStatus === 200 && output.dataApiUnauthStatus === 401 && output.dataApiInvalidStatus === 401}
    label: "Candidate at dev.fitsy.org must reject missing/invalid sessions (HTTP ${output.dataApiUnauthStatus}/${output.dataApiInvalidStatus}, expected 401/401); fixture login must succeed (HTTP ${output.dataApiLoginStatus}, expected 200)"
- evalScript: ${output.nearby = output.dataApiResponses[0]}
- assertTrue: ${output.nearby.status === 200 && json(output.nearby.body).data.length > 0}
# Direct API access must work before Dev Login runs its own RevenueCat sync.
- runScript: ../helpers/shuffle-subscriber.mjs
- assertTrue:
    condition: ${output.shuffleApiValidationStatus === 400}
    label: "dev.fitsy.org backend ${output.shuffleApiDeploymentSha} must support shuffle search (invalid shuffle HTTP ${output.shuffleApiValidationStatus}, expected 400); deploy the candidate API before replaying Simulator"
- assertTrue:
    condition: ${output.shuffleApiLoginStatus === 200 && output.shuffleSearchStatus === 200 && output.shuffleApiStatus === 200}
    label: "Shuffle preflight HTTP statuses: login=${output.shuffleApiLoginStatus}, search=${output.shuffleSearchStatus}, shuffle=${output.shuffleApiStatus}; expected 200/200/200"
- assertTrue:
    condition: ${output.shuffleApiUnlocked && output.shuffleApiHasDish && output.shuffleApiHasMacros && output.shuffleApiVerified && output.shuffleApiListChanged}
    label: "Shuffle preflight: unlocked=${output.shuffleApiUnlocked}, dish=${output.shuffleApiHasDish}, macros=${output.shuffleApiHasMacros}, verified=${output.shuffleApiVerified}, listChanged=${output.shuffleApiListChanged}; search=${output.shuffleSearchCount}, shuffle=${output.shuffleResultCount}, fitting=${output.shuffleTotal}"
# Establish the search area before launch.
- setLocation:
    latitude: 34.0407
    longitude: -118.2468
- launchApp:
    clearState: true
    clearKeychain: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- tapOn:
    id: welcome-login
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- tapOn: ".*Dev Login.*"
- extendedWaitUntil:
    visible: "Search restaurants or dishes"
    timeout: 30000
- assertNotVisible: "Dev Login Failed"
- openLink: com.fitsy.mobile://search?shuffleDebug=1
- tapOn:
    text: "^Open$"
    optional: true
- tapOn:
    id: discovery-location
- scrollUntilVisible:
    element: "Search near DTLA"
    direction: DOWN
- tapOn: "Search near DTLA"
- tapOn:
    id: preview-edit-targets
- runFlow:
    when:
      visible:
        id: meal-filter-unlink
    commands:
      - tapOn:
          id: meal-filter-unlink
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "40"
- tapOn: "Carbs grams"
- eraseText: 7
- inputText: "60"
- tapOn: "Fat grams"
- eraseText: 7
- inputText: "20"
- tapOn: "Calories per meal"
- eraseText: 7
- inputText: "600"
- tapOn:
    id: meal-filter-apply
# Capture actual card text; neither shuffle relies on a fixed restaurant or dish.
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- assertVisible:
    id: shuffle-button
# Opening an unrelated editor must preserve the loaded hero and usable list.
- copyTextFrom:
    id: discovery-hero
- evalScript: ${output.perfHero = maestro.copiedText}
- tapOn:
    id: preview-edit-targets
- runFlow: ../helpers/dismiss-meal-targets.yaml
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 10000
- copyTextFrom:
    id: discovery-hero
- assertTrue: ${maestro.copiedText === output.perfHero}
- scrollUntilVisible:
    element:
      id: preview-pick-3
    direction: DOWN
- assertVisible:
    id: preview-pick-3
- takeScreenshot: discovery-scroll
- scrollUntilVisible:
    element:
      id: discovery-hero
    direction: UP
- copyTextFrom:
    id: discovery-hero
- evalScript: ${output.beforeShuffleHero = maestro.copiedText}
- tapOn:
    id: shuffle-button
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 10000
- assertVisible:
    id: discovery-search-bar
- assertVisible:
    id: discovery-macro-strip
- assertNotVisible:
    id: shuffle-section
- assertNotVisible:
    id: shuffle-result
- assertNotVisible:
    id: shuffle-again
- assertNotVisible:
    id: shuffle-view-menu
- extendedWaitUntil:
    visible:
      id: shuffle-button
      enabled: true
    timeout: 30000
- copyTextFrom:
    id: discovery-hero
- assertTrue: ${maestro.copiedText !== output.beforeShuffleHero}
- evalScript: ${output.beforeSecondShuffleHero = maestro.copiedText}
- takeScreenshot: shuffle-search
- tapOn:
    id: shuffle-button
- extendedWaitUntil:
    visible:
      id: shuffle-button
      enabled: true
    timeout: 30000
- assertVisible:
    id: discovery-hero
- copyTextFrom:
    id: discovery-hero
- assertTrue: ${maestro.copiedText !== output.beforeSecondShuffleHero}
