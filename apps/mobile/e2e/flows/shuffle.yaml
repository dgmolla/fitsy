# Standard synthetic dev seed plus an entitled account with PostHog's shuffle
# boolean flag enabled. Debug-only shuffleSeed makes each lottery replayable.
# No purchase, entitlement override or flag override occurs in this journey.
appId: com.fitsy.mobile
tags: [billing, discovery, changed-journey, 'fixture:entitled-dev', 'store:test-store']
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- assertTrue: ${!!LOGIN_EMAIL && !!LOGIN_PASSWORD}
- evalScript: ${output.seed = http.get('https://dev.fitsy.org/api/restaurants?lat=34.0407&lng=-118.2468&q=Seed%20Bowl%20Co')}
- assertTrue: ${output.seed.status === 200 && json(output.seed.body).data.length > 0}
- launchApp:
    clearState: true
    clearKeychain: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- tapOn:
    id: welcome-login
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- tapOn: ".*Dev Login.*"
- extendedWaitUntil:
    visible: "Search restaurants or dishes"
    timeout: 30000
- assertNotVisible: "Dev Login Failed"
- openLink: com.fitsy.mobile://search?shuffleSeed=maestro-shuffle
- tapOn:
    text: "^Open$"
    optional: true
- tapOn:
    id: discovery-location
- scrollUntilVisible:
    element: "Search near DTLA"
    direction: DOWN
- tapOn: "Search near DTLA"
- tapOn:
    id: preview-edit-targets
- runFlow:
    when:
      visible:
        id: meal-filter-unlink
    commands:
      - tapOn:
          id: meal-filter-unlink
- tapOn: "Protein grams"
- eraseText: 7
- inputText: "28"
- tapOn: "Carbs grams"
- eraseText: 7
- inputText: "34"
- tapOn: "Fat grams"
- eraseText: 7
- inputText: "5"
- tapOn: "Calories per meal"
- eraseText: 7
- inputText: "280"
- tapOn:
    id: meal-filter-apply
- extendedWaitUntil:
    visible:
      id: shuffle-button
    timeout: 30000
- tapOn:
    id: shuffle-button
- extendedWaitUntil:
    visible:
      id: shuffle-dish
      text: "Protein Smoothie"
    timeout: 20000
- assertVisible:
    id: shuffle-restaurant
    text: "Seed.*"
- assertVisible:
    id: shuffle-macro-calories
    text: "≈[0-9]+ kcal"
- assertVisible:
    id: shuffle-macro-proteinG
    text: "≈28 g protein"
- assertVisible:
    id: shuffle-macro-carbsG
    text: "≈34 g carbs"
- assertVisible:
    id: shuffle-macro-fatG
    text: "≈5 g fat"
- assertVisible:
    id: shuffle-distance
    text: '[0-9]+\.[0-9] mi away'
- assertVisible:
    id: shuffle-again
- assertVisible:
    id: shuffle-view-menu
- assertNotVisible:
    id: shuffle-locked
- takeScreenshot: shuffle-seeded-result
- tapOn:
    id: shuffle-again
- extendedWaitUntil:
    visible:
      id: shuffle-dish
      text: "Protein Smoothie"
    timeout: 20000
- copyTextFrom:
    id: shuffle-restaurant
- evalScript: ${output.restaurant = maestro.copiedText}
- tapOn:
    id: shuffle-view-menu
- extendedWaitUntil:
    visible: ${output.restaurant}
    timeout: 20000
- assertVisible: "Protein Smoothie"
- takeScreenshot: shuffle-selected-menu
- openLink: com.fitsy.mobile://search?shuffleSeed=maestro-shuffle
- tapOn:
    text: "^Open$"
    optional: true
- tapOn:
    id: preview-edit-targets
- tapOn: "Fat grams"
- eraseText: 7
- inputText: "0"
- tapOn:
    id: meal-filter-apply
- tapOn:
    id: shuffle-button
- extendedWaitUntil:
    visible:
      id: shuffle-empty
    timeout: 20000
- assertVisible: "Nothing fits nearby"
- assertVisible:
    id: shuffle-edit-targets
- assertNotVisible:
    id: shuffle-view-menu
- takeScreenshot: shuffle-empty
