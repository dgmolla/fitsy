# Create a real paywall decline, then retain app storage while clearing the
# disposable simulator's auth keychain to reproduce anonymous return.
appId: com.fitsy.mobile
tags: [billing, discovery, onboarding, auth, changed-journey]
---
- launchApp:
    clearState: true
    clearKeychain: true
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible:
          id: welcome-start
- tapOn:
    point: "92%,93%"
- openLink: com.fitsy.mobile://welcome/location-permission
- tapOn:
    text: "^Open$"
    optional: true
- tapOn:
    id: location-choose-area
- tapOn: "Search near DTLA"
- extendedWaitUntil:
    visible:
      id: goal-lose_fat
    timeout: 30000
- tapOn:
    id: goal-lose_fat
- tapOn:
    id: welcome-continue
# A direct payment link cannot expose plans before account creation.
- openLink: com.fitsy.mobile://welcome/payment
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- assertNotVisible:
    id: paywall-logo
# Authenticate through the configured disposable dev account and decline the
# real paywall. This does not purchase or synthesize entitlement.
- tapOn: "Dev login"
- extendedWaitUntil:
    visible:
      id: paywall-logo
    timeout: 30000
- scrollUntilVisible:
    element:
      id: welcome-skip
    direction: DOWN
- tapOn:
    id: welcome-skip
- tapOn:
    id: paywall-discount-decline
    optional: true
- extendedWaitUntil:
    visible:
      id: paywall-decline
    timeout: 10000
- tapOn:
    id: paywall-decline
- extendedWaitUntil:
    visible:
      id: paywall-logo
    timeout: 15000
# Clear only this disposable simulator's keychain. AsyncStorage still contains
# the observed decline and onboarding checkpoint, so the next launch is
# anonymous with real prior-decline state.
- stopApp
- launchApp:
    clearState: false
    clearKeychain: true
- openLink: com.fitsy.mobile://welcome/preview
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- assertNotVisible:
    id: paywall-logo
# Continuing from the real nutrition-source screen carries onboarding intent.
- openLink: com.fitsy.mobile://welcome/how-it-works
- tapOn:
    text: "^Open$"
    optional: true
- assertVisible:
    id: nutrition-source-published
- assertVisible:
    id: nutrition-source-estimated
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: welcome-continue
      - extendedWaitUntil:
          visible:
            id: preview-guide
          timeout: 15000
- tapOn:
    id: coachmark-skip
    optional: true
- assertVisible:
    id: preview-guide
- assertVisible:
    id: preview-pick-2
# Replay can move back and forward without erasing the bounded preview entry.
- tapOn:
    id: preview-back
- assertVisible:
    id: nutrition-source-published
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: welcome-continue
      - extendedWaitUntil:
          visible:
            id: preview-guide
          timeout: 15000
- assertVisible:
    id: preview-pick-2
# Restaurant details still require payment; preview is not an entitlement.
- tapOn:
    id: discovery-hero
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- assertNotVisible:
    id: preview-guide
# The locked choice survives interruption at sign-in, without a paywall flash.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 30000
- assertNotVisible:
    id: paywall-logo
# A direct preview link after the locked choice cannot reuse the old entry.
- openLink: com.fitsy.mobile://welcome/preview
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- assertNotVisible:
    id: preview-guide
