# Create a real paywall decline, then retain app storage while clearing the
# disposable simulator's auth keychain to reproduce anonymous return.
appId: com.fitsy.mobile
tags: [billing, discovery, onboarding, auth, changed-journey, 'fixture:unsubscribed-dev', 'store:test-store']
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- tapOn:
    point: "92%,93%"
- openLink: com.fitsy.mobile://welcome/location-permission
- tapOn:
    text: "^Open$"
    optional: true
- runFlow:
    file: ../helpers/discovery-signin.yaml
    env:
      DESTINATION: "^location-(use-current|continue-area)$"
- runFlow: ../helpers/open-location-picker.yaml
- tapOn: "Search near DTLA"
- extendedWaitUntil:
    visible:
      id: goal-lose_fat
    timeout: 30000
- tapOn:
    id: goal-lose_fat
- tapOn:
    id: welcome-continue
# The real account signed in before location lookup. A direct payment link
# still enforces entitlement and opens the ordinary free-account paywall.
- openLink: com.fitsy.mobile://welcome/payment
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: paywall-logo
    timeout: 30000
- assertNotVisible: "Continue with Apple"
- scrollUntilVisible:
    element:
      id: welcome-skip
    direction: DOWN
- tapOn:
    id: welcome-skip
- tapOn:
    id: paywall-discount-decline
    optional: true
- extendedWaitUntil:
    visible:
      id: paywall-decline
    timeout: 10000
- tapOn:
    id: paywall-decline
- extendedWaitUntil:
    visible:
      id: paywall-logo
    timeout: 15000
# Clear only this disposable simulator's keychain. AsyncStorage still contains
# the observed decline and onboarding checkpoint, so the next launch is
# anonymous with real prior-decline state.
- stopApp
- launchApp:
    clearState: false
    clearKeychain: true
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
- waitForAnimationToEnd:
    timeout: 10000
- openLink: com.fitsy.mobile://welcome/preview
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- assertNotVisible:
    id: paywall-logo
# Native cancellation leaves the data destination pending and plans hidden.
- tapOn:
    id: signup-apple
- extendedWaitUntil:
    visible: "^(Sign In Failed|Cancel)$"
    timeout: 15000
- takeScreenshot: no-trial-native-apple-result
- runFlow:
    when:
      visible: "^Cancel$"
    commands:
      - tapOn: "^Cancel$"
- runFlow:
    when:
      visible: "Sign In Failed"
    commands:
      - tapOn: "OK"
- assertVisible:
    id: signup-apple
- assertNotVisible:
    id: paywall-logo
# The protected data destination survives interruption at sign-in without a paywall flash.
- stopApp
- launchApp
# XCTest can observe the terminated PID on its first hierarchy request.
# Retry only relaunch observation, retaining the required sign-in assertion.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible: "Continue with Apple"
          timeout: 30000
- assertNotVisible:
    id: paywall-logo
# A direct preview link after the locked choice cannot reuse the old entry.
- openLink: com.fitsy.mobile://welcome/preview
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 15000
- assertNotVisible:
    id: preview-guide
# Cancel the resumed checkout and retry with the same account.
# Cancellation must not reveal the old paywall or bounce back into sign-in.
- tapOn:
    id: welcome-back
- extendedWaitUntil:
    visible:
      id: welcome-start
    timeout: 15000
- assertNotVisible:
    id: paywall-logo
- assertNotVisible: "Continue with Apple"
- openLink: com.fitsy.mobile://welcome/location-permission
- tapOn:
    text: "^Open$"
    optional: true
# Account-owned goals are hidden while signed out. Restore authentication
# before entering the goal-dependent nutrition context screen.
- runFlow:
    file: ../helpers/discovery-signin.yaml
    env:
      DESTINATION: "^location-(use-current|continue-area)$"
- openLink: com.fitsy.mobile://welcome/goal
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: goal-lose_fat
    timeout: 15000
- tapOn:
    id: goal-lose_fat
- tapOn:
    id: welcome-continue
- extendedWaitUntil:
    visible:
      id: tried-meal_prep
    timeout: 15000
- openLink: com.fitsy.mobile://welcome/how-it-works
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: nutrition-source-published
    timeout: 15000
- tapOn:
    id: welcome-continue
- extendedWaitUntil:
    visible:
      id: preview-guide
    timeout: 30000
- tapOn:
    id: coachmark-skip
    optional: true
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- tapOn:
    id: discovery-hero
- extendedWaitUntil:
    visible:
      id: paywall-logo
    timeout: 30000
- assertVisible:
    id: paywall-offer-paid
- assertNotVisible: "Continue with Apple"
# Native Back must not pop into the spent preview and bounce into checkout.
# The visible Back control below remains the owned cancellation path.
- swipe:
    start: "1%,50%"
    end: "95%,50%"
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    id: paywall-offer-paid
- assertNotVisible:
    id: preview-guide
- assertNotVisible: "Continue with Apple"
- tapOn:
    id: welcome-back
- extendedWaitUntil:
    visible:
      id: paywall-back-to-plans
    timeout: 15000
- assertNotVisible:
    id: preview-back
- tapOn:
    id: paywall-back-to-plans
- assertVisible:
    id: paywall-offer-paid
- stopApp
- launchApp
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: paywall-offer-paid
          timeout: 30000
- assertNotVisible: "Continue with Apple"
