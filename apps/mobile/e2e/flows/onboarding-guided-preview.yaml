# Real dev coverage and live offering terms. No purchase on the shared dev account.
appId: com.fitsy.mobile
tags: [billing, discovery, onboarding, changed-journey]
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Find meals that fit"
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    point: "92%,93%"
- tapOn:
    id: welcome-start
- assertVisible: "Example.*"
- tapOn:
    id: welcome-continue
- tapOn:
    id: tried-calorie_apps
- tapOn:
    id: welcome-continue
- assertVisible: "Know what fits.*"
- tapOn:
    id: welcome-continue
- assertVisible: "Where would you.*"
- tapOn:
    id: location-choose-area
- tapOn: "Search near DTLA"
- extendedWaitUntil:
    visible:
      id: welcome-continue
      enabled: true
    timeout: 30000
- assertVisible: "About the nutrition"
- assertVisible: ".*dishes with nutrition within 3 miles.*"
- tapOn:
    id: welcome-continue
- assertVisible: "Know your numbers.*"
- tapOn:
    id: welcome-continue
- assertVisible: "Enter my meal targets.*"
- assertVisible: "Help me set targets.*"
- tapOn:
    id: target-mode-known
- assertVisible: "Enter per-meal targets.*"
- assertNotVisible: "What's your goal.*"
- tapOn:
    id: meal-target-calories
- inputText: "600"
- tapOn:
    id: meal-target-protein
- inputText: "40"
- tapOn:
    id: meal-target-carbs
- inputText: "60"
- tapOn:
    id: meal-target-fat
- inputText: "20"
- tapOn:
    id: welcome-continue
- extendedWaitUntil:
    visible:
      id: coachmark-next
    timeout: 30000
- assertVisible: "Your meal targets"
- tapOn:
    id: coachmark-next
- assertVisible: "Follow your craving"
- tapOn:
    id: coachmark-back
- assertVisible: "Your meal targets"
- tapOn:
    id: coachmark-next
- assertVisible: "Follow your craving"
- tapOn:
    id: coachmark-next
- assertVisible: "Real meals. Know the source."
- tapOn:
    id: coachmark-next
- assertVisible: "Wherever your day takes you"
- tapOn:
    id: coachmark-next
- assertVisible: "5 OF 5"
- assertVisible: ".*Try your first craving now.*"
- tapOn: "Find my meal"
- assertNotVisible:
    id: coachmark-next
- tapOn:
    id: preview-show-tour
- assertVisible: "1 OF 5"
- tapOn:
    id: coachmark-skip
- assertVisible:
    id: discovery-hero
- assertVisible: "600"
- assertVisible: "40g"
- tapOn:
    id: preview-edit-targets
- assertVisible: "600"
- tapOn: "Increase Protein"
- assertVisible: "600"
- tapOn:
    id: meal-filter-apply
- extendedWaitUntil:
    visible: "45g"
    timeout: 30000
- assertVisible: "600"
- tapOn:
    id: discovery-search
- inputText: "chicken"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- assertVisible: "chicken"
- tapOn:
    id: discovery-clear-search
- tapOn:
    id: discovery-search
- inputText: "pizza"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- assertVisible: "pizza"
- tapOn:
    id: discovery-hero
- assertVisible: "Create an account"
- tapOn:
    id: welcome-back
- assertVisible:
    id: preview-guide
- assertVisible: "pizza"
# A separate paywall visit must not inherit an abandoned menu intent.
- openLink: com.fitsy.mobile://welcome/payment
- extendedWaitUntil:
    visible:
      id: paywall-price-yearly
    timeout: 15000
- assertVisible: "Search your craving. See full menus. Save meals that fit."
- assertNotVisible: "See the full menu for.*"
- tapOn:
    id: welcome-back
- assertVisible:
    id: preview-guide
- assertVisible: "pizza"
- scrollUntilVisible:
    element:
      id: preview-pick-3
    direction: DOWN
- assertVisible:
    id: preview-pick-3
- scrollUntilVisible:
    element:
      id: locked-value-cta
    direction: DOWN
- assertVisible: "Explore more meals and full menus with Pro"
# Replaying area setup requires explicit confirmation of saved targets.
- openLink: com.fitsy.mobile://welcome/location-permission
- tapOn:
    id: location-choose-area
- tapOn: "Search near DTLA"
- extendedWaitUntil:
    visible:
      id: welcome-continue
      enabled: true
    timeout: 30000
- assertVisible: "About the nutrition"
- tapOn:
    id: welcome-continue
- assertVisible: "Know your numbers.*"
- tapOn:
    id: welcome-continue
- assertVisible:
    id: target-use-saved
- assertVisible: "Edit my meal targets.*"
- assertVisible: "Help me recalculate.*"
- tapOn:
    id: target-use-saved
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- assertVisible: "45g"
- assertVisible: "600"
- assertVisible: "pizza"
# A legacy preview link must reach the welcome preview, without a paywall loop.
- openLink: com.fitsy.mobile://search?preview=1
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- assertVisible: "pizza"
- assertNotVisible:
    id: paywall-price-yearly
- stopApp
- openLink: com.fitsy.mobile://search?preview=1
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: preview-guide
          timeout: 30000
- assertVisible: "pizza"
- assertVisible: "45g"

- assertNotVisible:
    id: coachmark-next
- tapOn:
    id: preview-show-tour
- assertVisible: "1 OF 5"
- tapOn:
    id: coachmark-skip
