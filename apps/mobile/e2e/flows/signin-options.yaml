# From the welcome screen, the login link opens /auth/login ("Welcome back"
# with Apple and Google options).
# Target: the e2e-simulator build (embedded JS bundle). clearState is correct
# there; against a dev-client install it would drop you in the launcher UI.
appId: com.fitsy.mobile
tags: [auth, changed-journey]
---
- launchApp:
    clearState: true
    clearKeychain: true
# Retry only the first accessibility read: XCTest can reject a moving React frame.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible: ".*Log in.*"
          timeout: 15000
- tapOn:
    id: welcome-login
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 10000
- assertVisible: "Continue with Apple"
- assertVisible: "Continue with Google"
- assertNotVisible: "Continue with email"
# The documented review deep link remains available, but rejects ordinary
# accounts before their password is submitted to the API.
- openLink: "fitsy://auth/reviewer"
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "App Review access"
    timeout: 10000
- tapOn: "Email"
- inputText: "not-a-reviewer@example.test"
- tapOn: "Password"
- inputText: "fixture-password"
- tapOn: "Sign in"
- assertVisible: "Not a review account"
- assertVisible: "This sign-in is reserved for App Store review."
- tapOn: "OK"
- assertVisible: "App Review access"
