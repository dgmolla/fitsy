# Fresh-install cold start lands on the welcome problem screen.
# Guards the +not-found boot-loop class (env wiring) and the first-run path.
# Target: the e2e-simulator build (embedded JS bundle). clearState is correct
# there; against a dev-client install it would drop you in the launcher UI.
appId: com.fitsy.mobile
---
- launchApp:
    clearState: true
# Retry only the first accessibility read: XCTest can reject a moving React frame.
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 15000
- assertVisible: ".*Log in.*"
- assertVisible: "Good food. Your goals in mind."
# Start goes directly to location, without a second generic promise screen.
- tapOn:
    id: welcome-start
- extendedWaitUntil:
    visible:
      id: location-use-current
    timeout: 15000
- assertVisible:
    id: location-choose-area
- assertNotVisible: "Discover restaurants that fit your goals"
