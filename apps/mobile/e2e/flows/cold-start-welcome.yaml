# Fresh-install cold start lands on the welcome problem screen.
# Guards the +not-found boot-loop class (env wiring) and the first-run path.
# Supports embedded bundles and Debug clients using owned local Metro.
# Clearing app and keychain state preserves the signed-out starting point.
appId: com.fitsy.mobile
tags: [onboarding, changed-journey]
---
- launchApp:
    clearState: true
    clearKeychain: true
# Retry only the first accessibility read: XCTest can reject a moving React frame.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- assertVisible: ".*Log in.*"
- assertVisible: "Good food. Your goals in mind."
# Start requires account sign-in before a live location lookup.
- tapOn:
    id: welcome-start
- extendedWaitUntil:
    visible:
      id: signup-apple
    timeout: 15000
- assertVisible:
    id: signup-google
- assertNotVisible:
    id: paywall-plan-yearly
- assertNotVisible: "Discover restaurants that fit your goals"
