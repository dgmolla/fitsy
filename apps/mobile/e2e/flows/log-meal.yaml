# This checkout records saved meals, not a dietary meal log.
# Requires a disposable entitled dev account with a completed profile.
# The native Dev Login reads the same EXPO_PUBLIC_* values from owned Metro.
appId: com.fitsy.mobile
tags: [auth, discovery, changed-journey, 'fixture:entitled-dev', 'store:test-store']
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- assertTrue: ${!!LOGIN_EMAIL && !!LOGIN_PASSWORD}
- evalScript: ${output.search = http.get('https://dev.fitsy.org/api/restaurants?lat=34.0522&lng=-118.2437&radius=5&q=Seed%20Bowl%20Co')}
- assertTrue: ${output.search.status === 200}
- evalScript: >-
    ${output.seed = json(output.search.body).data.filter(function (r) { return r.name === 'Seed Bowl Co #01'; })[0]}
- assertTrue: ${!!output.seed}
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-login
    timeout: 30000
- tapOn:
    id: welcome-login
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- tapOn: ".*Dev Login.*"
- extendedWaitUntil:
    visible: "Search restaurants or dishes"
    timeout: 30000
- openLink: ${'com.fitsy.mobile://restaurant/' + output.seed.id}
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Seed Bowl Co #01"
    timeout: 20000
- tapOn:
    text: Got it
    optional: true
- tapOn: "Search the menu.*"
- inputText: Grilled Chicken Bowl
- assertVisible: "1 dish matches"
# Reset only this synthetic seed bookmark in the disposable test account.
- runFlow:
    when:
      visible: "Remove bookmark"
    commands:
      - tapOn: "Remove bookmark"
      - extendedWaitUntil:
          visible: "Bookmark item"
          timeout: 15000
- tapOn: "Bookmark item"
- extendedWaitUntil:
    visible: "Remove bookmark"
    timeout: 15000
- openLink: com.fitsy.mobile://saved
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Grilled Chicken Bowl"
    timeout: 20000
- assertVisible: ".*Seed Bowl Co #01.*"
- assertVisible: "Remove bookmark"
- takeScreenshot: saved-meal
- launchApp
- openLink: com.fitsy.mobile://saved
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Grilled Chicken Bowl"
    timeout: 20000
- assertVisible: ".*Seed Bowl Co #01.*"
