# Uses the standard dev data from prisma/seed.ts --data-only.
# These are synthetic seed expectations, not a nutrition-accuracy reference.
# Checks serving and recovery by editing the query.
# First-tap clear-button behavior is outside this query-edit scenario.
appId: com.fitsy.mobile
tags:
  - 'fixture:unsubscribed-dev'
  - 'store:test-store'
  - changed-journey
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- evalScript: ${output.apiPaths = ['/api/restaurants?lat=34.0522&lng=-118.2437&radius=5&q=Seed%20Bowl%20Co']}
- runScript: ../helpers/data-api.mjs
- assertTrue:
    condition: ${output.dataApiLoginStatus === 200 && output.dataApiUnauthStatus === 401 && output.dataApiInvalidStatus === 401}
    label: "Candidate at ${EXPO_PUBLIC_API_URL} must reject missing/invalid sessions (HTTP ${output.dataApiUnauthStatus}/${output.dataApiInvalidStatus}, expected 401/401); fixture login must succeed (HTTP ${output.dataApiLoginStatus}, expected 200)"
- evalScript: ${output.search = output.dataApiResponses[0]}
- assertTrue: ${output.search.status === 200}
- evalScript: >-
    ${output.seed = json(output.search.body).data.filter(function (r) { return r.name === 'Seed Bowl Co #01'; })[0]}
- assertTrue: ${!!output.seed}
- evalScript: ${output.apiPaths = ['/api/restaurants/' + output.seed.id + '/menu']}
- runScript: ../helpers/data-api.mjs
- assertTrue:
    condition: ${output.dataApiLoginStatus === 200 && output.dataApiUnauthStatus === 401 && output.dataApiInvalidStatus === 401}
    label: "Candidate at ${EXPO_PUBLIC_API_URL} must reject missing/invalid sessions (HTTP ${output.dataApiUnauthStatus}/${output.dataApiInvalidStatus}, expected 401/401); fixture login must succeed (HTTP ${output.dataApiLoginStatus}, expected 200)"
- evalScript: ${output.response = output.dataApiResponses[0]}
- assertTrue: ${output.response.status === 200}
- evalScript: ${output.menu = json(output.response.body).data}
- assertTrue: ${output.menu.totalItemCount === 8 && output.menu.locked && output.menu.menuItems.length === 3}
- evalScript: ${output.chicken = output.menu.menuItems.filter(function (i) { return i.name === 'Grilled Chicken Bowl'; })[0]}
- assertTrue: ${!!output.chicken && output.chicken.macros.calories === 520 && output.chicken.macros.proteinG === 42 && output.chicken.macros.carbsG === 48 && output.chicken.macros.fatG === 14 && output.chicken.macros.confidence === 'HIGH'}
# Start signed out, then authenticate before the bounded menu sample.
- launchApp:
    clearState: true
    clearKeychain: true
# The first XCTest observation can race the native cold-launch transition.
# Retry readiness before any interaction; missing UI or a crash still fails.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Development Build"
          commands:
            - tapOn: '^http://(localhost|127\.0\.0\.1):[0-9]+$'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: welcome-start
          timeout: 30000
- openLink: ${'fitsy://restaurant/' + output.seed.id}
- tapOn:
    text: Open
    optional: true
- runFlow:
    file: ../helpers/discovery-signin.yaml
    env:
      DESTINATION: menu-search
- extendedWaitUntil:
    visible: "Seed Bowl Co #01"
    timeout: 20000
- tapOn:
    text: Got it
    optional: true
- assertVisible: "8 items"
- assertVisible: "3 dishes match"
- assertVisible: ".*dish name hidden, view plans to find this meal.*"
- tapOn: "Search the menu.*"
- inputText: fitsy-no-such-dish
- assertVisible: "No dishes match these filters."
- eraseText
- assertNotVisible: "No dishes match these filters."
- assertVisible: "3 dishes match"
- assertVisible: ".*dish name hidden, view plans to find this meal.*"
