# Synthetic eligibility on live Test Store prices. Visual proof only, never a purchase receipt.
appId: com.fitsy.mobile
tags: [billing, onboarding, changed-journey]
---
- launchApp:
    clearState: true
    clearKeychain: true
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible:
          id: welcome-start
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "92%,93%"
- openLink: com.fitsy.mobile://welcome/trial?devTrialVisual=1
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Try Fitsy free"
    timeout: 30000
- assertVisible:
    id: trial-offer-note
- assertVisible: "Synthetic trial eligibility for visual testing.*"
- tapOn:
    id: welcome-continue
- extendedWaitUntil:
    visible:
      id: trial-reminder-note
    timeout: 15000
- assertVisible: "Synthetic trial eligibility for visual testing.*"
- tapOn:
    id: trial-reminder-allow
- extendedWaitUntil:
    visible:
      id: dev-trial-visual-note
    timeout: 15000
- assertVisible:
    id: paywall-offer-timeline
- assertVisible:
    id: paywall-step-today
- assertVisible:
    id: paywall-step-reminder
- assertVisible:
    id: paywall-step-charge
- assertNotVisible:
    id: paywall-hero
- assertVisible: "Start free trial"
- assertVisible: "No commitment, cancel anytime"
- assertNotVisible:
    id: paywall-timeline
- scrollUntilVisible:
    element:
      id: paywall-price-yearly
    direction: UP
- tapOn:
    id: paywall-plan-monthly
- assertVisible:
    id: paywall-price-monthly
- tapOn:
    id: welcome-back
- assertVisible:
    id: trial-reminder-note
- tapOn:
    id: welcome-back
- assertVisible: "Try Fitsy free"
