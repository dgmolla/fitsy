# Synthetic eligibility on live Test Store prices. Visual proof only, never a purchase receipt.
appId: com.fitsy.mobile
tags: [billing, onboarding, changed-journey, 'store:test-store']
---
- launchApp:
    clearState: true
    clearKeychain: true
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible:
          id: welcome-start
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "92%,93%"
- openLink: com.fitsy.mobile://welcome/trial?devTrialVisual=1
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "We want you to try Fitsy for free"
    timeout: 30000
- assertVisible: "Try Fitsy"
- assertVisible: "No payment due now"
- assertNotVisible: "Meet Fitsy Pro"
- assertNotVisible:
    id: trial-offer-note
- tapOn:
    id: welcome-continue
- extendedWaitUntil:
    visible:
      id: trial-reminder-note
    timeout: 15000
- assertVisible: "Synthetic trial eligibility for visual testing.*"
- tapOn:
    id: trial-reminder-allow
- extendedWaitUntil:
    visible:
      id: dev-trial-visual-note
    timeout: 15000
- assertVisible:
    id: paywall-offer-timeline
- assertVisible:
    id: paywall-step-today
- assertVisible:
    id: paywall-step-reminder
- assertVisible:
    id: paywall-step-charge
- assertVisible: "In 14 days"
# Morning quiet hours can move the reminder onto the preceding calendar day.
- assertVisible: "In 1[12] days"
- assertNotVisible:
    id: paywall-hero
- assertVisible: "Start free trial"
- assertVisible: "No commitment, cancel anytime"
- assertNotVisible:
    id: paywall-timeline
- scrollUntilVisible:
    element:
      id: paywall-price-yearly
    direction: UP
- tapOn:
    id: paywall-plan-monthly
- assertVisible:
    id: paywall-price-monthly
- copyTextFrom:
    id: paywall-price-monthly
- evalScript: ${output.monthlyPrice = maestro.copiedText}
- scrollUntilVisible:
    element:
      id: paywall-terms
    direction: DOWN
- copyTextFrom:
    id: paywall-terms
- assertTrue: ${maestro.copiedText.includes('14 days free') && maestro.copiedText.includes(output.monthlyPrice) && maestro.copiedText.includes('Renews automatically')}
- scrollUntilVisible:
    element:
      id: paywall-plan-yearly
    direction: UP
- tapOn:
    id: paywall-plan-yearly
- copyTextFrom:
    id: paywall-price-yearly
- evalScript: ${output.annualPrice = maestro.copiedText}
- scrollUntilVisible:
    element:
      id: paywall-terms
    direction: DOWN
- copyTextFrom:
    id: paywall-terms
- assertTrue: ${maestro.copiedText.includes('14 days free') && maestro.copiedText.includes(output.annualPrice) && maestro.copiedText.includes('Renews automatically')}
- tapOn:
    id: welcome-back
- assertVisible:
    id: trial-reminder-note
- tapOn:
    id: welcome-back
- assertVisible: "We want you to try Fitsy for free"
