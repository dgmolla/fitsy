# Permission denial must retain a usable city picker, tappable pins and search.
appId: com.fitsy.mobile
tags: [billing, discovery, changed-journey, 'fixture:entitled-dev', 'store:test-store']
env:
  LOGIN_EMAIL: ${EXPO_PUBLIC_DEV_LOGIN_EMAIL}
  LOGIN_PASSWORD: ${EXPO_PUBLIC_DEV_LOGIN_PASSWORD}
---
- runFlow:
    file: ../helpers/map-search-setup.yaml
    env:
      LOCATION_PERMISSION: never
- extendedWaitUntil:
    visible:
      id: map-location-fallback
    timeout: 15000
- assertVisible: "Location: Silver Lake, LA"
- takeScreenshot: map-search-location-denied
- tapOn:
    id: discovery-location
- extendedWaitUntil:
    visible: "Choose a neighborhood"
    timeout: 5000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Search near Hollywood"
    direction: DOWN
    centerElement: true
- tapOn: "Search near Hollywood"
- assertVisible: "Location: Hollywood"
- assertNotVisible:
    id: map-location-fallback
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible:
    id: map-preview-open
- tapOn:
    id: map-pin-0
- assertVisible:
    id: map-preview-open
- takeScreenshot: map-area-pin-recovered
- tapOn:
    id: map-search-entry
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-goals
- tapOn:
    id: discovery-search
- inputText: pizza
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: discovery-hero
    timeout: 30000
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-goals
- assertVisible:
    id: discovery-search
    text: pizza
- assertVisible:
    id: discovery-shuffle-button
- tapOn:
    id: discovery-view-toggle
- extendedWaitUntil:
    visible:
      id: map-pin-0
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: map-pin-0
- assertVisible:
    id: map-preview-open
- assertVisible:
    id: shuffle-button
- assertVisible: "Location: Hollywood"
- assertVisible:
    id: map-search-entry
    text: "Search: pizza"
- assertVisible:
    id: floating-tab-bar
- takeScreenshot: map-search-manual-area
