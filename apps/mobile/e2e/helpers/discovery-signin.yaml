# Anonymous sessions (#801/#820) go straight from welcome-start to the location
# step, so the sign-in screen only appears when no session can be created.
# Sign in with the fixture account when it appears; either way, wait for the
# caller's destination.
appId: com.fitsy.mobile
---
- runFlow:
    when:
      visible:
        id: signup-dev
    commands:
      - assertVisible:
          id: signup-apple
      - assertVisible:
          id: signup-google
      - assertNotVisible:
          id: paywall-plan-yearly
      - tapOn:
          id: signup-dev
- extendedWaitUntil:
    visible:
      id: ${DESTINATION}
    timeout: 30000
- assertNotVisible: "Dev Login Failed"
