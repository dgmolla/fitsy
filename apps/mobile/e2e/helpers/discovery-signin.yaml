# Anonymous sessions (#801/#820) skip the sign-in gate after welcome-start, so
# open the sign-in route explicitly to use the fixture account.
appId: com.fitsy.mobile
---
- runFlow:
    when:
      notVisible:
        id: signup-dev
    commands:
      - openLink: com.fitsy.mobile://welcome/signin
      - tapOn:
          text: "^Open$"
          optional: true
- extendedWaitUntil:
    visible:
      id: signup-dev
    timeout: 30000
- assertVisible:
    id: signup-apple
- assertVisible:
    id: signup-google
- assertNotVisible:
    id: paywall-plan-yearly
- tapOn:
    id: signup-dev
- extendedWaitUntil:
    visible:
      id: ${DESTINATION}
    timeout: 30000
- assertNotVisible: "Dev Login Failed"
