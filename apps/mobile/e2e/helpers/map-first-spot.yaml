# Returning from the ordinary list starts the carousel at the first current result.
# Pin hit testing is covered separately, including after denied-location recovery.
appId: com.fitsy.mobile
---
- tapOn:
    id: map-search-entry
- assertNotVisible:
    id: discovery-map
- assertVisible:
    id: discovery-goals
- tapOn:
    id: discovery-view-toggle
- extendedWaitUntil:
    visible:
      id: map-card-0
    timeout: 15000
