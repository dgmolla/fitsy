# Opening the chooser is idempotent. Judge success by the sheet itself, because
# press feedback or an unrelated transition can satisfy retryTapIfNoChange.
appId: com.fitsy.mobile
---
- extendedWaitUntil:
    visible:
      id: location-choose-area
      enabled: true
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: location-choose-area
- waitForAnimationToEnd
# A first press can land mid-transition. Press again only if the sheet is not
# open: a conditional keeps a recovered press from leaving a failed assertion.
- runFlow:
    when:
      notVisible: "Choose a neighborhood"
    commands:
      - tapOn:
          id: location-choose-area
- extendedWaitUntil:
    visible: "Choose a neighborhood"
    timeout: 10000
