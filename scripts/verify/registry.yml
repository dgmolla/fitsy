# Registry of verification checks. See README.md for the contract.
# layer: 0 = fast local gate, 1 = static, 2 = unit tests, 3 = build/integration,
#        6 = deployed-environment E2E, 9 = post-deploy
#        (numbers align with L-layers in docs/engineering/devops/autonomous-shipping.md)
# blocking: true | shadow   (shadow = reported, never fails the run)
# runs: local | ci | scheduled   (contexts this check executes in)
# paths: advisory (shadow) checks only; select when --scope=changed matches a glob.
# Blocking checks always run within their layer/context; path filters cannot hide them.
checks:
  - name: focused-tests
    script: focused-tests.sh
    layer: 1
    blocking: true
    runs: [local]
    why: Meaningful selected reproduction and regression tests before independent review.

  - name: structural
    script: structural.sh
    layer: 0
    blocking: true
    runs: [local] # CI classify owns this unconditional baseline.
    why: Growing invariant checklist (docs layout, route guards, routing-table sync, size/any/console warnings).

  - name: secrets
    script: secrets.sh
    layer: 0
    blocking: true
    runs: [local] # CI classify owns this unconditional baseline.
    why: Hardcoded keys, committed .env files, committed build output. Moved from ci.yml security job 2026-09-07.

  - name: lint
    script: lint.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    why: ESLint across workspaces.

  - name: typecheck
    script: typecheck.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    why: Workspace type-check scripts (api, mobile, shared, scripts); API regenerates Prisma from the current schema and scripts resolves shared imports to checkout-owned source.

  - name: performance
    script: performance.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    why: Stable zero budgets for routed prototypes and resolved runtime discovery/LLM dependencies; no network or timing thresholds.

  - name: product-flow
    stage: acceptance
    script: product-flow.sh
    layer: 1
    blocking: true
    runs: [local]
    why: Source-bound evidence for impact-selected journeys and MCP categories; every selected flow and its required assertions must pass.

  - name: boundaries
    script: boundaries.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    why: T3 boundaries as code (dependency-cruiser); added in autoship step 3, 2026-09-07.

  - name: size-check
    script: size-check.sh
    layer: 1
    blocking: true
    standalone: true # CI classify runs it once; --only remains supported.
    runs: [ci]
    why: Report counted review size; a coherent outcome has no arbitrary line cap.

  - name: actionlint
    script: actionlint.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    why: Always lint workflows in L1; filtering to changed workflows allowed green API PRs followed by failing main checks (incident 262).

  - name: domain-check
    script: domain-check.sh
    layer: 1
    blocking: true
    standalone: true   # runs only via --only=domain-check (its own CI job with PR context)
    runs: [ci]
    why: Report routed domains without rejecting a coherent cross-layer outcome; unresolved comparison still fails.

  - name: context-freshness
    script: context-freshness.sh
    layer: 1
    blocking: true
    runs: [local] # CI classify owns this unconditional baseline.
    why: T14 - a stale command or path in a context file misleads every zero-context author; caught a dead root-CLAUDE.md pointer on its first run (2026-09-07).

  - name: migration-safety
    script: migration-safety.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    why: T9 - destructive migrations need a down.sql (expand-migrate-contract otherwise); extends structural check 13. Added in autoship step 6, 2026-09-07.

  - name: own-code-mocks
    script: own-code-mocks.sh
    layer: 2
    blocking: shadow
    runs: [local, ci]
    paths: ["apps/api/**"]
    why: Mock only external services, never your own code (testing-strategy). Shadow until pre-existing offenders migrate to the DB-container tests.

  - name: test
    database: true
    script: test.sh
    layer: 2
    blocking: true
    runs: [local, ci]
    why: Shared pure contracts plus complete affected API, scripts and mobile tests, including Python cleanup and loop recovery; API and scripts Jest refuse shared database targets before suites load. Retain all diagnostics through run.mjs even when later workspaces pass (incident 267).

  - name: rate-limit-store
    script: rate-limit-store.sh
    layer: 2
    blocking: true
    runs: [local, ci]
    why: Actual Redis Lua and independent API workers prove shared quotas, forged-header resistance, atomic admission, key bounds and expiry.

  - name: media-integration
    script: media-integration.sh
    layer: 2
    blocking: true
    runs: [local]
    why: Real decoder, attachment and credential-isolation tests for changed simulator, product-flow or loop host controls; missing local tools fail.

  - name: build
    script: build.sh
    layer: 3
    blocking: true
    runs: [local, ci]
    why: Offline Next.js production compilation catches what tests miss and asserts no stray compiled output; deployment Redis bindings are checked before migrations by the guarded Vercel Git build.

  - name: mobile-bundle
    script: mobile-bundle.sh
    layer: 3
    blocking: true
    runs: [local, ci]
    why: Production iOS minified JS and gzip size budgets from the measured audit; keyless local export only, no native build or OTA publication.

  - name: api-e2e
    script: api-e2e.sh
    layer: 6
    blocking: shadow
    runs: [scheduled, local]   # bare invocation defaults to dev.fitsy.org
    paths: ["apps/api/**", "packages/**", "prisma/**"]
    why: >
      Deployed-API smoke (health, data-route 401s, authenticated entitlement locks, register).
      Invoked directly by deploy.yml against prod (--prod-safe) and usable
      against dev/previews; replaced scripts/verify-prod.sh 2026-09-07.

  - name: mutation
    script: mutation.sh
    layer: 2
    blocking: shadow
    runs: [scheduled]
    paths: ["apps/api/lib/**", "packages/shared/src/**"]
    why: >
      T5 - agent-written tests must be able to fail; mutation score is the
      proof. Scheduled-only (minutes even incremental); the break threshold
      (stryker.config.mjs) ratchets +5/month while green per rollout step 10.

  - name: dev-drift
    script: dev-drift.sh
    layer: 3
    blocking: shadow
    runs: [scheduled, local]
    paths: ["prisma/**"]
    why: >
      The dev environment must track main's schema and keep seed data so E2E
      (L6, L7) runs against a known state. Added with the dev environment,
      2026-08-29 (autonomous-shipping rollout step 4b).
