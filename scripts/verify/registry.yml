# Registry of verification checks. See README.md for the contract.
# layer: 0 = fast local gate, 1 = static, 2 = unit tests, 3 = build/integration
#        (numbers align with L-layers in docs/engineering/devops/autonomous-shipping.md)
# blocking: true | shadow   (shadow = reported, never fails the run)
# runs: local | ci | scheduled   (contexts this check executes in)
# paths: [] or absent = always; otherwise the check runs only when --scope=changed
#        finds a changed file matching a glob.
checks:
  - name: structural
    script: structural.sh
    layer: 0
    blocking: true
    runs: [local, ci]
    why: Growing invariant checklist (docs layout, route guards, routing-table sync, size/any/console warnings).

  - name: secrets
    script: secrets.sh
    layer: 0
    blocking: true
    runs: [local, ci]
    why: Hardcoded keys, committed .env files, committed build output. Moved from ci.yml security job 2026-09-07.

  - name: lint
    script: lint.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    paths: ["apps/**", "packages/**", "scripts/**", "eslint.config.mjs"]
    why: ESLint across workspaces.

  - name: typecheck
    script: typecheck.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    paths: ["apps/**", "packages/**", "scripts/**", "prisma/**", "tsconfig.json"]
    why: tsc --noEmit per workspace (api, mobile, shared, scripts).

  - name: boundaries
    script: boundaries.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    paths: ["apps/**", "packages/**", "scripts/**", ".dependency-cruiser.cjs"]
    why: T3 boundaries as code (dependency-cruiser); added in autoship step 3, 2026-09-07.

  - name: size-check
    script: size-check.sh
    layer: 1
    blocking: true
    runs: [ci]
    why: T8 - PRs over 600 changed lines (excluding lockfiles/migrations/snapshots) are unreviewable; override-size label escapes with justification.

  - name: actionlint
    script: actionlint.sh
    layer: 1
    blocking: true
    runs: [local, ci]
    paths: [".github/**"]
    why: Workflow files are tier-high attack surface (prompt-injection mitigations live there); lint them.

  - name: domain-check
    script: domain-check.sh
    layer: 1
    blocking: true
    standalone: true   # runs only via --only=domain-check (its own CI job with PR context)
    runs: [ci]
    why: Single-domain PRs (route-reviewers.sh). Moved from reviewer.yml 2026-09-07.

  - name: test
    script: test.sh
    layer: 2
    blocking: true
    runs: [local, ci]
    paths: ["apps/**", "packages/**", "scripts/**", "prisma/**", "package.json"]
    why: api unit tests with coverage gate + scripts tests. --passWithNoTests removed 2026-09-07 (T5).

  - name: build
    script: build.sh
    layer: 3
    blocking: true
    runs: [ci]
    paths: ["apps/api/**", "packages/**", "prisma/**", "package.json", "package-lock.json", "vercel.json"]
    why: Next.js production build catches what tests miss; asserts no compiled output lands in the tree.

  - name: dev-drift
    script: dev-drift.sh
    layer: 3
    blocking: shadow
    runs: [scheduled, local]
    paths: ["prisma/**"]
    why: >
      The dev environment must track main's schema and keep seed data so E2E
      (L6, L7) runs against a known state. Added with the dev environment,
      2026-08-29 (autonomous-shipping rollout step 4b).
